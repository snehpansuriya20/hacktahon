  }
  function section(id, icon, title, nodes, emptyTxt, more, l) {
    const s = ce('div', 'cuSec'); s.id = 'cuS-' + id;
    s.append(ce('h4', '', icon + ' ' + title));
    if (nodes.length) { nodes.forEach(n => s.append(n)); if (more) s.append(ce('div', 'cuMore', l.more(more))); }
    else if (emptyTxt) s.append(ce('p', 'hint', emptyTxt));
    return s;
  }

  function render() {
    const s = cu; if (!s || !s.res) return;
    const l = L(), r = s.res, c = s.c, body = $('cuBody');
    drawCtl(); paintPriv();
    $('cuSub').textContent = l.sub(r.total);
    $('cuShare').style.display = canPost(c) ? '' : 'none';
    body.replaceChildren();
    $('cuCopy').disabled = $('cuShare').disabled = !r.total;
    if (!r.total) { body.appendChild(ce('p', 'hint', l.empty)); return; }

    const tl = ce('div', 'cuTl', l.tl(r, spanText(r, l), r.topics.slice(0, 4)));
    const mediaBits = [['image', '📷'], ['video', '🎥'], ['file', '📄'], ['poll', '📊']].filter(x => r.media[x[0]]).map(x => x[1] + ' ' + r.media[x[0]]);
    if (mediaBits.length) tl.append(ce('small', '', mediaBits.join('   ')));
    body.appendChild(tl);

    if (r.you.length) body.appendChild(section('you', '👋', l.you, r.you.map(m => itemBtn(c, m)), '', 0, l));
    body.appendChild(section('deadlines', '📅', l.dl, r.deadlines.map(d => itemBtn(c, d.m, chipFor(d, l))), l.noDl, r.moreDl, l));
    body.appendChild(section('decisions', '✅', l.dec, r.decisions.map(m => itemBtn(c, m)), l.noDec, r.moreDec, l));
    body.appendChild(section('open', '❓', l.q, r.open.map(m => itemBtn(c, m)), l.noQ, r.moreQ, l));
    if (r.links.length) body.appendChild(section('links', '🔗', l.links, r.links.map(x => itemBtn(c, x.m)), '', 0, l));
    if (r.topics.length) {
      const sec = ce('div', 'cuSec'), tp = ce('div', 'cuTop');
      sec.append(ce('h4', '', '🏷️ ' + l.topics)); r.topics.forEach(w => tp.append(ce('span', '', w))); sec.append(tp); body.appendChild(sec);
    }
    body.appendChild(ce('p', 'cuMore', l.tap));
    if (s.focus) { const t = $('cuS-' + s.focus); s.focus = null; if (t) setTimeout(() => t.scrollIntoView({ block: 'start', behavior: 'smooth' }), 80); }
  }

  async function fetchRange(c, range) {
    const cols = 'id,conversation_id,sender_id,body,kind,reply_to,created_at';
    try {
      let q = nookDb.from('messages').select(cols).eq('conversation_id', c.id);
      if (range === 'missed' && c.catchFrom) {
        const { data, error } = await q.gt('created_at', new Date(c.catchFrom).toISOString()).order('created_at', { ascending: true }).limit(1000);
        if (error) throw error; return data || [];
      }
      const { data, error } = await q.order('created_at', { ascending: false }).limit(typeof range === 'number' ? range : 200);
      if (error) throw error; return (data || []).reverse();
    } catch (e) {
      const all = c.loaded ? c.msgs : [];
      if (range === 'missed' && c.catchFrom) { const t = Date.parse(c.catchFrom); return all.filter(m => Date.parse(m.created_at) > t); }
      return all.slice(-(typeof range === 'number' ? range : 200));
    }
  }

  async function load() {
    const s = cu; if (!s) return; const my = ++seq;
    s.res = null; drawCtl();
    $('cuBody').replaceChildren(ce('p', 'hint', L().loading)); $('cuSub').textContent = ''; paintPriv();
    $('cuCopy').disabled = $('cuShare').disabled = true;
    /* this is the only moment a chat is read: log the tap (never text) and honour the admin switch */
    const g = await nookDb.rpc('log_ai_request', { p_cid: s.c.id, p_range: String(s.range) });
    if (g.error && !/PGRST202|schema cache|does not exist|Could not find/i.test((g.error.code || '') + ' ' + (g.error.message || ''))) {
      closePanel(); toast(g.error.message); return;
    }
    const raw = await fetchRange(s.c, s.range);
    if (my !== seq || cu !== s) return;
    s.res = analyze(raw, s.c);
    if (!s.lang) s.lang = s.res.texts && s.res.hing / s.res.texts > 0.25 ? 'hi' : 'en';
    render();
    nookDb.rpc('ai_usage_count', { p_cid: s.c.id }).then(x => {
      if (!x.error && typeof x.data === 'number' && cu === s) { s.use = x.data; paintPriv(); }
    }).catch(() => {});
  }

  function openCatchUp(c, o) {
    o = o || {};
    if (!c) return toast('Open a chat first');
    if (c.aiOff) return toast('An admin turned Catch me up off in this chat');
    let range = o.range != null ? o.range : (c.catchFrom && missedCount(c) > 0 ? 'missed' : 200);
    if (range === 'missed' && !c.catchFrom) range = 200;
    cu = { c, range, lang: o.lang || store.get('nook-cu-lang') || null, focus: o.focus || null, res: null, use: null };
    ov.classList.add('open');
    return load();
  }

  /* summary as plain text (for Copy and Share to chat) */
  function plain(s) {
    const l = LBL[s.lang || 'en'], r = s.res, c = s.c, out = [];
    const nm = id => (c.members[id] && c.members[id].name) || 'Someone';
    out.push('✨ Catch me up · ' + l.tldr, l.tl(r, spanText(r, l), r.topics.slice(0, 4)));
    const sec = (ico, title, items, fn) => { if (!items.length) return; out.push('', ico + ' ' + title); items.slice(0, 5).forEach(x => out.push('• ' + fn(x))); };
    sec('📅', l.dl, r.deadlines, d => { const k = chipFor(d, l); return (k ? k.t + ' — ' : '') + nm(d.m.sender_id) + ': ' + clip(d.m.body, 90); });
    sec('✅', l.dec, r.decisions, m => nm(m.sender_id) + ': ' + clip(m.body, 90));
    sec('❓', l.q, r.open, m => nm(m.sender_id) + ': ' + clip(m.body, 90));
    out.push('', '🔒 ' + l.shareNote);
    return out.join('\n').slice(0, 1900);
  }
  $('cuCopy').onclick = async () => {
    if (!cu || !cu.res) return;

  };
  $('cuShare').onclick = async () => {
    const s = cu; if (!s || !s.res || !s.res.total) return;
    if (!canPost(s.c)) return toast('Only the sender can post here');

  };

  /* ------------------------------------------------------------------ read markers, banner, buttons */
  const missedCount = c => {
    if (!c.catchFrom) return 0;
    const t = Date.parse(c.catchFrom);
    return c.msgs.filter(m => m.sender_id !== me.id && Date.parse(m.created_at) > t).length;
  };
  const readTimers = {};
  function markRead(c, now) {
    if (!c || !me) return;

  const banner = ce('div', 'cuBanner');
  banner.innerHTML = '<span id="cuBText"></span><button type="button" class="go" id="cuBGo"></button><button type="button" class="x" id="cuBX" aria-label="Dismiss">✕</button>';
  $('head').after(banner);
  $('cuBGo').onclick = () => { banner.style.display = 'none'; openCatchUp(active, { range: 'missed' }); };
  $('cuBX').onclick = () => { if (active) active.bannerOff = true; banner.style.display = 'none'; };

  function updateBanner(c) {
    const n = c && c === active && c.loaded ? missedCount(c) : 0;
    const show = n >= BANNER_MIN && !c.aiOff && !c.bannerOff;
    banner.style.display = show ? 'flex' : 'none';
    if (!show) return;
    const l = LBL[store.get('nook-cu-lang') === 'hi' ? 'hi' : 'en'];
    const more = c.msgs.length >= 300 && Date.parse(c.msgs[0].created_at) > Date.parse(c.catchFrom);

  }
  const refreshAi = () => updateBanner(active);

  const cuBtn = ce('button', 'tool', '✨'); cuBtn.type = 'button'; cuBtn.id = 'cuBtn';

  roBtn.onclick = () => openCatchUp(active); $('ro').appendChild(roBtn);
  $('text').placeholder = 'Write a message · try @nook';

  /* type @nook (or @ai) in any chat: nothing is sent, it opens Catch me up instead.

  document.addEventListener('submit', e => {

  /* admin switch inside group / broadcast info */
  const _oi = window.openInfo;
  window.openInfo = function (c) {
    _oi(c);
    const old = $('cuInfoRow'); if (old) old.remove();
    if (c.type === 'direct') return;
    const on = !c.aiOff, row = ce('div', 'cuInfo'); row.id = 'cuInfoRow';
    row.append(ce('div', '', '✨ Catch me up is ' + (on ? 'on' : 'off') + ' in this ' + c.type + '. It runs on each person’s own device and only when they tap it or type @nook.'));
    if (c.owner === me.id || (c.roles && c.roles[me.id] === 'admin')) {
      const b = ce('button', 'pchip', on ? 'Turn off' : 'Turn on'); b.type = 'button';
      b.onclick = async () => {
        const { error } = await nookDb.rpc('set_chat_ai', { p_cid: c.id, p_enabled: !on });
        if (error) return toast(error.message);
        c.aiOff = on; toast('Catch me up turned ' + (on ? 'off' : 'on')); await loadChats();
      };
      row.append(b);
    }
    $('iMembers').before(row);
  };
})();
</script>
</body>
</html>
