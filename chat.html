<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nook: chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121A33; --snow:#F4F6FB; --glacier:#9CC7F5; --marigold:#FFB627; --pine:#1F6F5C; --mist:#DDE5F2; --card:#fff; --muted:#5b6688;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--snow);color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--snow);font-family:var(--head);font-weight:800;font-size:28px;z-index:50}
.app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
.app.hidden{visibility:hidden}

/* sidebar */
.side{background:var(--ink);color:var(--snow);display:flex;flex-direction:column;min-height:0}
.me{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--ink);flex:none;background:var(--glacier)}
.me b{display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{opacity:.65}
.me .grow{flex:1;min-width:0}
.icon-btn{border:0;background:rgba(244,246,251,.12);color:var(--snow);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}
.icon-btn:hover{background:rgba(244,246,251,.22)}
.new{position:relative}
.menu{position:absolute;right:0;top:44px;background:var(--card);color:var(--ink);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);z-index:10;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:15px}
.menu button:hover{background:var(--mist)}
.search{padding:6px 18px 12px}
.search input{width:100%;font:15px var(--body);padding:11px 16px;border-radius:999px;border:0;background:rgba(244,246,251,.12);color:var(--snow)}
.search input::placeholder{color:rgba(244,246,251,.55)}
.filters{display:flex;gap:6px;padding:0 18px 12px}
.filters button{flex:1;border:0;padding:8px 4px;border-radius:999px;background:transparent;color:rgba(244,246,251,.7);font-weight:600;font-size:14px}
.filters button[aria-selected="true"]{background:var(--snow);color:var(--ink)}
.list{flex:1;overflow-y:auto;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:12px;border-radius:16px}
.item:hover{background:rgba(244,246,251,.08)}
.item.active{background:rgba(244,246,251,.16)}
.item .mid{flex:1;min-width:0}
.item .row{display:flex;justify-content:space-between;gap:8px}
.item b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time{font-size:12px;opacity:.6;flex:none}
.item .last{font-size:14px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--marigold);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;flex:none}
.empty{padding:24px 16px;opacity:.7;font-size:15px;line-height:1.5}
.t-group{background:var(--marigold)}.t-broadcast{background:#7fd1b9}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--snow)}
.head{display:none;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--mist)}
.head b{display:block;line-height:1.2}
.head small{color:var(--muted)}
.back{display:none;border:0;background:var(--mist);border-radius:12px;padding:8px 12px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:22px;display:none;flex-direction:column;gap:8px}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--mist);padding:4px 12px;border-radius:999px;margin:6px 0}
.hello{margin:auto;color:var(--muted);text-align:center}
.msg{max-width:min(520px,78%);padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop .25s cubic-bezier(.2,1.4,.4,1) both;transform-origin:bottom;overflow-wrap:anywhere;white-space:pre-wrap}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.msg .who{display:block;font-size:12px;font-weight:600;opacity:.7;margin-bottom:2px}
.msg.them{background:var(--card);border:1px solid var(--mist);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--marigold);border-bottom-right-radius:5px;align-self:flex-end}
.msg.cast{background:var(--pine);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
.composer{display:none;gap:10px;padding:14px 22px;background:var(--card);border-top:1px solid var(--mist)}
.composer input{flex:1;font:16px var(--body);padding:13px 18px;border-radius:999px;border:2px solid var(--mist);background:var(--snow);color:var(--ink)}
.composer input:focus{outline:none;border-color:var(--glacier)}
.send{border:0;border-radius:999px;background:var(--ink);color:var(--snow);font-weight:600;font-size:16px;padding:0 24px}
.send:hover{background:#26325c}
.send:disabled{opacity:.5}
.none{margin:auto;text-align:center;color:var(--muted);max-width:26em;padding:24px}
.none h2{font-family:var(--head);font-size:28px;color:var(--ink);margin-bottom:6px}

/* new chat dialog + toast */
.overlay{position:fixed;inset:0;background:rgba(18,26,51,.55);display:none;place-items:center;z-index:40;padding:16px}
.overlay.open{display:grid}
.dialog{background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.dialog h3{font-family:var(--head);font-size:24px;font-weight:800;margin-bottom:12px}
.dialog input{width:100%;font:16px var(--body);padding:13px 16px;border-radius:14px;border:2px solid var(--mist);background:var(--snow);color:var(--ink)}
.dialog input:focus{outline:none;border-color:var(--glacier)}
.results{margin:10px 0;max-height:300px;overflow-y:auto;min-height:40px}
.result{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:14px}
.result:hover{background:var(--mist)}
.result small{display:block;color:var(--muted)}
.hint{color:var(--muted);padding:10px;font-size:15px}
.close{border:0;background:var(--mist);border-radius:999px;padding:10px 18px;font-weight:600;float:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;z-index:60;display:none}

.msg{cursor:pointer}
.msg.sticker{background:none;border:0;padding:2px 6px}.msg.sticker .big{font-size:64px;line-height:1.15}
.msg.gif{padding:4px;background:var(--card);border:1px solid var(--mist);color:var(--ink)}.msg.gif img{display:block;max-width:240px;width:100%;border-radius:14px}
.msg.flash{box-shadow:0 0 0 3px var(--glacier)}
.quote{border-left:3px solid var(--pine);background:rgba(18,26,51,.08);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:13px}
.quote b{display:block;font-size:12px}.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;opacity:.8}
.msg.cast .quote{border-left-color:var(--marigold);background:rgba(255,255,255,.15)}
.reacts{display:flex;flex-wrap:wrap;gap:4px}.reacts:not(:empty){margin-top:6px}
.chip{border:1px solid rgba(18,26,51,.2);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:13px}
.chip.mine{border-color:var(--ink);font-weight:600;background:var(--card)}
.bar{position:fixed;display:none;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);z-index:30}
.bar button{border:0;background:none;font-size:22px;border-radius:999px;padding:4px 7px}.bar button:hover{background:var(--mist)}
.bar .rep{font-size:14px;font-weight:600;padding:4px 12px}
.replybar{display:none;align-items:center;gap:10px;padding:8px 22px;background:var(--card);border-top:1px solid var(--mist)}
.replybar .rq{flex:1;min-width:0;border-left:3px solid var(--pine);padding-left:10px;font-size:13px}
.replybar b{display:block}.replybar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.replybar button{border:0;background:var(--mist);border-radius:999px;width:32px;height:32px}
.ro{display:none;text-align:center;padding:16px;background:var(--card);border-top:1px solid var(--mist);color:var(--muted)}
.picker{display:none;background:var(--card);border-top:1px solid var(--mist);padding:10px 22px;height:280px;flex-direction:column}
.picker.open{display:flex}
.ptabs{display:flex;gap:6px;margin-bottom:8px}.ptabs button{border:0;border-radius:999px;padding:6px 16px;background:var(--mist);font-weight:600}
.ptabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;min-height:0}.pbody[hidden]{display:none}
.stk{border:0;background:none;font-size:34px;padding:6px;border-radius:12px}.stk:hover{background:var(--mist)}
.pbody input{width:100%;font:15px var(--body);padding:9px 14px;border-radius:999px;border:2px solid var(--mist);margin-bottom:8px}
.gifgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gifgrid button{border:0;background:var(--mist);border-radius:10px;overflow:hidden;padding:0}.gifgrid img{display:block;width:100%;height:90px;object-fit:cover}
.gpaste{display:flex;gap:6px;margin-top:8px}.gpaste input{margin:0}.gpaste button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:0 16px;font-weight:600}
.tool{border:0;background:var(--mist);border-radius:999px;width:46px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pchip{border:0;background:var(--mist);border-radius:999px;padding:5px 12px;font-size:14px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.primary{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;padding:10px 22px}.primary:disabled{opacity:.5}
/* ---- part 3 additions ---- */
.avatar{position:relative}
.avatar.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#2fd17b;border:2px solid var(--ink)}
.head .avatar.on::after{border-color:var(--card)}
.head{cursor:default}.head.info{cursor:pointer}
.head small.typing,.last.typing{color:var(--pine);font-style:italic;opacity:1}
.side .last.typing{color:#7fd1b9}
.msg a{color:inherit;text-decoration:underline}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:rgba(18,26,51,.12);padding:0 5px;border-radius:5px}
.mention{font-weight:700;color:var(--pine)}.mention.self{background:rgba(255,182,39,.35);border-radius:5px;padding:0 3px}
.msg.cast .mention{color:var(--marigold)}
.msg.emo{font-size:36px;line-height:1.2;padding:6px 12px}
.bar{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:22px}
.bar .rep.del{color:#c0392b}
.egroups{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}.egroups button{border:0;background:var(--mist);border-radius:999px;padding:3px 10px;font-size:18px}
.egroups button[aria-selected="true"]{background:var(--marigold)}
.egrid{display:flex;flex-wrap:wrap}.egrid .stk{font-size:26px;padding:4px 6px}
.member{display:flex;align-items:center;gap:12px;padding:8px 4px}.member small{display:block;color:var(--muted)}
.member .tag{margin-left:auto;font-size:12px;font-weight:700;background:var(--marigold);color:var(--ink);border-radius:999px;padding:2px 10px}
.minfo{max-height:300px;overflow-y:auto;margin:8px 0 12px}
.danger{border:0;border-radius:999px;background:#fde7e4;color:#a8281b;font-weight:600;padding:10px 20px}
html[data-theme="dark"]{--snow:#0b1021;--mist:#26304f;--card:#151c36;--muted:#9eaad0}
html[data-theme="dark"] body{color:#e8ecf8}
html[data-theme="dark"] .msg.me{color:#121A33}
html[data-theme="dark"] .mention{color:#7fd1b9}
html[data-theme="dark"] .msg.me .mention{color:#121A33}
html[data-theme="dark"] .menu,html[data-theme="dark"] .none h2,html[data-theme="dark"] .msg.gif{color:#e8ecf8}
html[data-theme="dark"] .composer input,html[data-theme="dark"] .pbody input,html[data-theme="dark"] .dialog input{color:#e8ecf8}
html[data-theme="dark"] .side{color:#F4F6FB}
html[data-theme="dark"] .icon-btn,html[data-theme="dark"] .search input{color:#F4F6FB}
html[data-theme="dark"] .filters button[aria-selected="true"]{background:#F4F6FB;color:#121A33}
html[data-theme="dark"] .send{color:#F4F6FB;background:#2b3a6e}
html[data-theme="dark"] .msg.them{border-color:var(--mist)}
html[data-theme="dark"] .danger{background:#4a1f1b;color:#ffb4aa}
@media (max-width:860px){
  .replybar,.picker{padding-left:14px;padding-right:14px}
  .app{grid-template-columns:1fr}
  .main{display:none}
  .app.show-chat .side{display:none}
  .app.show-chat .main{display:flex}
  .back{display:block}
  .msgs,.head,.composer{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="loading" id="loading">nook</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="me">
      <div class="avatar" id="meAvatar">?</div>
      <div class="grow"><b id="meName">...</b><small id="meUser"></small></div>
      <div class="new">
        <button class="icon-btn" id="newBtn" aria-haspopup="true">New</button>
        <div class="menu" id="newMenu" role="menu">
          <button role="menuitem" data-new="direct">New chat</button>
          <button role="menuitem" data-new="group">New group</button>
          <button role="menuitem" data-new="broadcast">New broadcast</button>
          <button role="menuitem" id="themeBtn">Dark mode</button>
          <button role="menuitem" id="soundBtn">Sound: on</button>
        </div>
      </div>
      <button class="icon-btn" id="logout">Log out</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search your chats" aria-label="Search your chats"></div>
    <div class="filters" role="tablist">
      <button role="tab" aria-selected="true" data-f="all">All</button>
      <button role="tab" aria-selected="false" data-f="direct">Direct</button>
      <button role="tab" aria-selected="false" data-f="group">Groups</button>
      <button role="tab" aria-selected="false" data-f="broadcast">Cast</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="main" id="main">
    <div class="none" id="none"><h2>Pick a chat</h2><p>Choose a conversation on the left, or press New to find someone by username.</p></div>
    <div class="head" id="head">
      <button class="back" id="back">Back</button>
      <div class="avatar" id="hAvatar">A</div>
      <div><b id="hName"></b><small id="hSub"></small></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="replybar" id="replyBar"><div class="rq"><b id="rName"></b><span id="rText"></span></div><button type="button" id="rCancel" aria-label="Cancel reply">&#10005;</button></div>
    <div class="picker" id="picker">
      <div class="ptabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-p="stickers">Stickers</button><button type="button" role="tab" aria-selected="false" data-p="emoji">Emoji</button><button type="button" role="tab" aria-selected="false" data-p="gifs">GIFs</button></div>
      <div class="pbody" id="pStickers"></div>
      <div class="pbody" id="pEmoji" hidden><div class="egroups" id="eGroups"></div><div class="egrid" id="eGrid"></div></div>
      <div class="pbody" id="pGifs" hidden>
        <input id="gifQ" type="search" placeholder="Search GIFs (powered by GIPHY)" aria-label="Search GIFs">
        <div class="gifgrid" id="gifGrid"></div>
        <form class="gpaste" id="gifPaste"><input id="gifUrl" placeholder="Or paste a GIF link (https://...)" aria-label="GIF link"><button>Send</button></form>
      </div>
    </div>
    <div class="ro" id="ro">Only the sender can post in this broadcast.</div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="tool" id="pickBtn" aria-label="Stickers and GIFs" aria-expanded="false">&#128522;</button>
      <input id="text" placeholder="Write a message" aria-label="Message" maxlength="2000">
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
  </section>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Start a new chat">
  <div class="dialog">
    <h3>Start a chat</h3>
    <input id="userQ" placeholder="Search by name or username" autocomplete="off">
    <div class="results" id="results"><p class="hint">Type at least 2 letters.</p></div>
    <button class="close" id="closeDlg">Close</button>
  </div>
</div>
<div class="overlay" id="gOverlay" role="dialog" aria-modal="true" aria-label="Create">
  <div class="dialog">
    <h3 id="gTitle">New group</h3>
    <input id="gName" maxlength="60" autocomplete="off">
    <p class="hint" id="gHint"></p>
    <div class="chips" id="gChips"></div>
    <input id="gQ" placeholder="Add people by name or username" autocomplete="off" style="margin-top:10px">
    <div class="results" id="gResults"></div>
    <div class="actions"><button class="close" id="gClose" type="button" style="float:none">Cancel</button><button class="primary" id="gCreate" type="button">Create</button></div>
  </div>
</div>
<div class="overlay" id="iOverlay" role="dialog" aria-modal="true" aria-label="Chat info">
  <div class="dialog">
    <h3 id="iTitle"></h3>
    <p class="hint" id="iHint"></p>
    <div class="minfo" id="iMembers"></div>
    <div class="actions"><button class="close" id="iClose" type="button" style="float:none">Close</button><button class="danger" id="iLeave" type="button">Leave</button></div>
  </div>
</div>
<div class="bar" id="bar" role="toolbar" aria-label="Message actions"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const initial = s => (s || '?').trim().charAt(0).toUpperCase();
let me = null, chats = [], byId = {}, active = null, filter = 'all';
let online = new Set(), live = null, soundOn = true;
const GIPHY_KEY = '';   // free key from developers.giphy.com enables GIF search

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.id); toast.id = setTimeout(() => t.style.display = 'none', 3200);
}
function fmt(iso){
  const d = new Date(iso), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
    : d.toLocaleDateString([], {day:'numeric', month:'short'});
}
const sortChats = () => chats.sort((a,b) =>
  new Date(b.last ? b.last.created_at : b.created) - new Date(a.last ? a.last.created_at : a.created));

/* ---------- Load conversations from the database ---------- */
async function loadChats(){
  const mine = await nookDb.from('conversation_members')
    .select('conversation_id, conversations(id,type,name,created_at,created_by)')
    .eq('user_id', me.id);
  if(mine.error){ toast('Could not load chats: ' + mine.error.message); return; }
  const ids = mine.data.map(r => r.conversation_id);
  if(!ids.length){ chats = []; byId = {}; renderList(); return; }

  const [mem, lastMsgs] = await Promise.all([
    nookDb.from('conversation_members').select('conversation_id,user_id,profiles(full_name,username)').in('conversation_id', ids),
    nookDb.from('messages').select('id,conversation_id,sender_id,body,kind,created_at')
      .in('conversation_id', ids).order('created_at', {ascending:false}).limit(300)
  ]);

  const old = byId; byId = {};
  chats = mine.data.map(r => {
    const c = r.conversations;
    const members = {};
    (mem.data || []).filter(m => m.conversation_id === c.id).forEach(m => {
      members[m.user_id] = { name: m.profiles ? m.profiles.full_name : 'Unknown', username: m.profiles ? m.profiles.username : '' };
    });
    const otherId = Object.keys(members).find(id => id !== me.id);
    const obj = old[c.id] || { id: c.id, msgs: [], loaded: false, unread: 0, last: null };
    obj.type = c.type; obj.owner = c.created_by; obj.members = members; obj.other = otherId; obj.created = c.created_at;
    obj.name = c.type === 'direct' ? (otherId ? members[otherId].name : 'Chat') : (c.name || 'Group');
    const n = Object.keys(members).length;
    obj.sub = c.type === 'direct'
      ? (otherId && members[otherId].username ? '@' + members[otherId].username : '')
      : c.type === 'broadcast'
        ? (c.created_by === me.id ? (n - 1) + ' recipients' : 'Broadcast by ' + (members[c.created_by] ? members[c.created_by].name : 'someone'))

    obj.last = (lastMsgs.data || []).find(m => m.conversation_id === c.id) || obj.last;
    byId[c.id] = obj;
    return obj;
  });

}

  el.className = 'msg ' + (mine ? (c.type === 'broadcast' ? 'cast' : 'me') : 'them') + (kind !== 'text' ? ' ' + kind : '');

/* One function handles every new message (sent by me or received live) */
async function handleMessage(m){
  let c = byId[m.conversation_id];
  if(!c){                                  // someone started a new chat with me
    await loadChats(); c = byId[m.conversation_id];
    if(!c) return;
  }
  if(c.loaded && c.msgs.some(x => x.id === m.id)) return;   // already shown
  m.reactions = m.reactions || []; c.last = m;
  if(c.loaded) c.msgs.push(m);
  if(active && active.id === c.id){
    addBubble(c, m); const box = $('msgs'); box.scrollTop = box.scrollHeight;
  } else if(m.sender_id !== me.id){
    c.unread++;
  }
  if(m.sender_id !== me.id && (document.hidden || !active || active.id !== c.id)) beep();
  if(c.typing) delete c.typing[m.sender_id];
  sortChats(); renderList();
}

function renderReacts(m){
  const el = $('msgs').querySelector('[data-id="' + m.id + '"]'); if(!el) return;

async function toggleReaction(m, emoji){
  const has = m.reactions.find(r => r.user_id === me.id && r.emoji === emoji);
  const key = { message_id: m.id, user_id: me.id, emoji };
  if(has){
    m.reactions = m.reactions.filter(r => r !== has); renderReacts(m);
    const { error } = await nookDb.from('message_reactions').delete().match(key);
    if(error){ m.reactions.push(has); renderReacts(m); toast('Could not remove reaction'); }
  } else {
    const r = { ...key }; m.reactions.push(r); renderReacts(m);
    const { error } = await nookDb.from('message_reactions').insert(key);
    if(error){ m.reactions = m.reactions.filter(x => x !== r); renderReacts(m); toast('Could not react'); }
  }
}
function applyReaction(r, add){
  for(const c of chats){
    const m = c.msgs.find(x => x.id === r.message_id); if(!m) continue;
    const i = m.reactions.findIndex(x => x.user_id === r.user_id && x.emoji === r.emoji);
    if(add && i < 0) m.reactions.push({ message_id: r.message_id, user_id: r.user_id, emoji: r.emoji });
    if(!add && i >= 0) m.reactions.splice(i, 1);
    renderReacts(m); return;
  }
}

const isEmojiOnly = t => { const x = t.trim(); return x.length > 0 && x.length <= 16 && /^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(x) && Array.from(x.replace(/\s/g, '')).length <= 4; };
function rich(text, c){
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s<]+|`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|_[^_\n]+_|@[A-Za-z0-9]{2,})/g;
  let last = 0, m;
  const add = (tag, str, cls) => { const e = document.createElement(tag); if(cls) e.className = cls; e.textContent = str; frag.appendChild(e); return e; };
  while((m = re.exec(text))){
    if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0]; last = m.index + tok.length;
    if(tok[0] === 'h'){
      const url = tok.replace(/[.,!?)]+$/, ''); last -= tok.length - url.length;
      if(safeUrl(url) || url.startsWith('http://')){ const a = add('a', url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.onclick = e => e.stopPropagation(); }
      else frag.appendChild(document.createTextNode(url));
    } else if(tok[0] === '`') add('code', tok.slice(1, -1));
    else if(tok.startsWith('**')) add('b', tok.slice(2, -2));
    else if(tok[0] === '*' || tok[0] === '_') add('i', tok.slice(1, -1));
    else {
      const uname = tok.slice(1).toLowerCase();
      const hit = Object.entries(c.members).find(([id, u]) => (u.username || '').toLowerCase() === uname);
      if(hit) add('span', tok, 'mention' + (hit[0] === me.id ? ' self' : ''));
      else frag.appendChild(document.createTextNode(tok));
    }
  }
  if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

let actx;
function beep(){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(.001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.15, actx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .25);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .26);
  }catch(e){}
}

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reactions' }, p => applyReaction(p.new, true))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'message_reactions' }, p => applyReaction(p.old, false))

  });

  /* ---------- pin chat + info + nicknames ---------- */
  const pinBtn = el('button', 'hbtn', 'Pin'); pinBtn.type = 'button'; pinBtn.id = 'pinBtn'; $('head').appendChild(pinBtn);
  async function togglePin() {
    const c = active; if (!c) return; const v = !c.pinned;
    const { error } = await nookDb.rpc('set_chat_pin', { p_cid: c.id, p_pinned: v });
    if (error) return toast(error.message);
    c.pinned = v; renderList(); updateHeader(); toast(v ? 'Chat pinned' : 'Chat unpinned');
  }
  $('head').addEventListener('click', e => {
    if (e.target.closest('.back')) return;
    if (e.target.closest('#pinBtn')) { e.stopImmediatePropagation(); togglePin(); return; }
    if (active && active.type === 'direct') { e.stopImmediatePropagation(); openInfo(active); }
  }, true);

  const _upd = window.updateHeader;
  window.updateHeader = function () { _upd(); pinBtn.textContent = active && active.pinned ? 'Unpin' : 'Pin'; };

  const _rl = window.renderList;
  window.renderList = function () {
    chats.sort((a, b) => (!!b.pinned) - (!!a.pinned));           // stable: keeps newest-first inside each group
    _rl();
    const q = $('q').value.trim().toLowerCase();
    const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
    document.querySelectorAll('#list .item').forEach((it, i) => {
      const t = it.querySelector('time'); if (rows[i] && rows[i].pinned && t) t.textContent = '📌 ' + t.textContent;
    });
  };

  function applyNicks() {
    chats.forEach(c => {
      Object.entries(c.members).forEach(([id, u]) => { if (u.real == null) u.real = u.name; u.name = nicks[id] || u.real; });
      if (c.type === 'direct' && c.other && c.members[c.other]) c.name = c.members[c.other].name;
    });
  }
  async function setNick(id) {
    let real = 'this person'; chats.forEach(c => { if (c.members[id]) real = c.members[id].real || c.members[id].name; });
    const v = prompt('Nickname for ' + real + ' (only you can see it). Leave empty to remove.', nicks[id] || '');
    if (v === null) return;
    const n = v.trim().slice(0, 40);
    const r = n ? await nookDb.from('nicknames').upsert({ owner_id: me.id, target_id: id, nickname: n })
                : await nookDb.from('nicknames').delete().eq('owner_id', me.id).eq('target_id', id);
    if (r.error) return toast('Could not save nickname: ' + r.error.message);
    if (n) nicks[id] = n; else delete nicks[id];
    applyNicks(); renderList(); updateHeader();
    if (active) { const c = active; openChat(c); openInfo(c); }
  }
  function decorate(c) {
    const ids = c.type === 'direct' ? [c.other] : Object.entries(c.members).sort((a, b) => (b[0] === c.owner) - (a[0] === c.owner)).map(x => x[0]);
    document.querySelectorAll('#iMembers .member').forEach((row, i) => {
      const id = ids[i]; if (!id || id === me.id) return;
      const b = el('button', 'pchip', nicks[id] ? 'Edit nickname' : 'Set nickname'); b.type = 'button'; b.style.marginLeft = '8px'; b.onclick = () => setNick(id); row.appendChild(b);
    });
  }
  const _info = window.openInfo;
  window.openInfo = function (c) {
    $('iLeave').style.display = '';
    if (c.type === 'direct') {
      const u = c.members[c.other] || { name: c.name, username: '' };
      $('iTitle').textContent = c.name; $('iHint').textContent = 'Direct chat' + (u.real && u.real !== u.name ? ' · real name: ' + u.real : '');
      const box = $('iMembers'); box.innerHTML = '';
      const r = el('div', 'member'); r.innerHTML = '<div class="avatar"></div><div><b></b><small></small></div>';
      const av = r.querySelector('.avatar'); av.textContent = initial(u.name); if (online.has(c.other)) av.classList.add('on');
      r.querySelector('b').textContent = u.name; r.querySelector('small').textContent = (u.username ? '@' + u.username : '') + (online.has(c.other) ? ' · online' : '');
      box.appendChild(r); $('iLeave').style.display = 'none'; $('iOverlay').classList.add('open');
    } else _info(c);
    decorate(c);
  };

  /* ---------- data: pins + nicknames, live poll votes ---------- */
  const _lc = window.loadChats;
  window.loadChats = async function () {
    await _lc();
    const [pn, nk] = await Promise.all([
      nookDb.from('conversation_members').select('conversation_id,pinned').eq('user_id', me.id),
      nookDb.from('nicknames').select('target_id,nickname').eq('owner_id', me.id)
    ]);
    if (!pn.error) pn.data.forEach(r => { if (byId[r.conversation_id]) byId[r.conversation_id].pinned = !!r.pinned; });
    if (!nk.error) { nicks = {}; nk.data.forEach(r => { nicks[r.target_id] = r.nickname; }); }
    applyNicks(); renderList(); updateHeader();
    if (!liveOn) {
      liveOn = true; let t;
      nookDb.channel('nook-polls').on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, () => { clearTimeout(t); t = setTimeout(refreshPolls, 300); }).subscribe();
    }
  };

  /* ---------- new message notifications ---------- */
  const nb = el('button', ''); nb.setAttribute('role', 'menuitem'); $('newMenu').appendChild(nb);
  const nbLabel = () => { nb.textContent = 'Notifications: ' + (window.Notification && Notification.permission === 'denied' ? 'blocked' : notifyOn ? 'on' : 'off'); };
  nbLabel();
  nb.onclick = async () => {
    notifyOn = !notifyOn; store.set('nook-notify', notifyOn ? 'on' : 'off');
    if (notifyOn && window.Notification && Notification.permission === 'default') await Notification.requestPermission();
    if (notifyOn && window.Notification && Notification.permission === 'denied') toast('Notifications are blocked in your browser settings');
    nbLabel();
  };
  document.addEventListener('pointerdown', () => {
    if (notifyOn && window.Notification && Notification.permission === 'default') Notification.requestPermission().then(nbLabel);
  }, { once: true });

  function notify(m) {
    if (!me || m.sender_id === me.id || notified.has(m.id)) return; notified.add(m.id);
    const c = byId[m.conversation_id]; if (!c || !notifyOn) return;
    const open = !document.hidden && active && active.id === c.id; if (open) return;
    const text = (c.type === 'direct' ? '' : nameOf(c, m.sender_id) + ': ') + snippet(m);
    if (document.hidden && window.Notification && Notification.permission === 'granted') {
      try { const n = new Notification(c.name, { body: text, tag: c.id }); n.onclick = () => { window.focus(); openChat(c); n.close(); }; return; } catch (e) {}
    }
    toast(c.name + ' · ' + text);
  }
  const _hm = window.handleMessage;
  window.handleMessage = async function (m) { await _hm(m); try { notify(m); } catch (e) {} };
})();

</script>

<!-- ===== Added feature: profile pictures ===== -->
<script>
(function () {
  'use strict';
  const AV_BUCKET = 'avatars', AV_SIZE = 256, AV_MAX_IN = 15 * 1024 * 1024;
  const avatars = {};                       // userId -> public photo url
  const avEl = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  const css = document.createElement('style');
  css.textContent = `
#meAvatar{cursor:pointer}
#meAvatar:hover{outline:2px solid var(--marigold);outline-offset:2px}
.avatar{background-size:cover;background-position:center}
.pf{text-align:center}
.pf .big{width:112px;height:112px;margin:6px auto 14px;font-size:44px;font-family:var(--head);font-weight:800}
.pf .pfn{font-weight:700;font-size:18px}.pf small{display:block;color:var(--muted);margin-bottom:12px}
.pf .actions{justify-content:center;flex-wrap:wrap}`;
  document.head.appendChild(css);

  /* show a photo (or the initial) inside any .avatar element */
  function setAv(node, id, fallback) {
    if (!node) return;
    const url = avatars[id];
    if (url) {
      node.style.backgroundImage = 'url("' + String(url).replace(/"/g, '%22') + '")';
      node.textContent = '';
    } else {
      node.style.backgroundImage = '';
      if (fallback != null) node.textContent = fallback;
    }
  }
  function repaint() {
    if (!me) return;
    setAv($('meAvatar'), me.id, initial(me.name));
    renderList(); updateHeader();
    const big = $('pfBig'); if (big) setAv(big, me.id, initial(me.name));
  }

  /* load everyone's photos (keeps initials if the avatar_url column does not exist yet) */
  async function loadAvatars() {
    try {
      const ids = new Set([me.id]);
      chats.forEach(c => Object.keys(c.members).forEach(id => ids.add(id)));
      const { data, error } = await nookDb.from('profiles').select('id,avatar_url').in('id', [...ids]);
      if (error || !data) return;
      data.forEach(r => { if (r.avatar_url) avatars[r.id] = r.avatar_url; else delete avatars[r.id]; });
    } catch (e) {}
  }
  let wired = false;
  const _lc = window.loadChats;
  window.loadChats = async function () {
    await _lc();
    await loadAvatars(); repaint();
    if (wired) return; wired = true;
    try {
      nookDb.channel('nook-profiles').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, p => {
        const r = p.new; if (!r || !me || r.id === me.id) return;
        if (r.avatar_url) avatars[r.id] = r.avatar_url; else delete avatars[r.id];
        repaint();
      }).subscribe();
    } catch (e) {}
  };

  /* draw photos in the sidebar, chat header and info dialog */
  const _rl = window.renderList;
  window.renderList = function () {
    _rl();
    const q = $('q').value.trim().toLowerCase();
    const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
    document.querySelectorAll('#list .item').forEach((it, i) => {
      const c = rows[i]; if (c && c.type === 'direct') setAv(it.querySelector('.avatar'), c.other, initial(c.name));
    });
  };
  const _uh = window.updateHeader;
  window.updateHeader = function () {
    _uh();
    if (active && active.type === 'direct') setAv($('hAvatar'), active.other, initial(active.name));
  };
  const _oi = window.openInfo;
  window.openInfo = function (c) {
    _oi(c);
    const ids = c.type === 'direct' ? [c.other]
      : Object.entries(c.members).sort((a, b) => (b[0] === c.owner) - (a[0] === c.owner)).map(x => x[0]);
    document.querySelectorAll('#iMembers .member').forEach((row, i) => {
      const id = ids[i]; if (id) setAv(row.querySelector('.avatar'), id, null);
    });
  };

  /* profile photo dialog */
  const ov = avEl('div', 'overlay'); ov.id = 'pfOv';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Profile photo');
  ov.innerHTML = '<div class="dialog pf"><h3>Profile photo</h3><div class="avatar big" id="pfBig"></div><div class="pfn" id="pfName"></div><small id="pfUser"></small>' +
    '<div class="actions"><button class="primary" id="pfChange" type="button">Choose photo</button><button class="danger" id="pfRemove" type="button">Remove</button><button class="close" id="pfClose" type="button" style="float:none">Close</button></div></div>';
  document.body.appendChild(ov);
  const fileIn = avEl('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.hidden = true; document.body.appendChild(fileIn);

  function openProfile() {
    if (!me) return;
    $('pfName').textContent = me.name; $('pfUser').textContent = me.username ? '@' + me.username : '';
    setAv($('pfBig'), me.id, initial(me.name));
    $('pfRemove').style.display = avatars[me.id] ? '' : 'none';
    ov.classList.add('open');
  }
  const closeProfile = () => ov.classList.remove('open');
  $('pfClose').onclick = closeProfile;
  ov.addEventListener('click', e => { if (e.target === ov) closeProfile(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProfile(); });

  $('meAvatar').setAttribute('role', 'button'); $('meAvatar').tabIndex = 0; $('meAvatar').setAttribute('aria-label', 'Change profile photo');
  $('meAvatar').onclick = openProfile;
  $('meAvatar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProfile(); } });
  const mi = avEl('button', '', 'Profile photo'); mi.setAttribute('role', 'menuitem'); mi.onclick = openProfile; $('newMenu').appendChild(mi);

  $('pfChange').onclick = () => fileIn.click();
  fileIn.onchange = () => { const f = fileIn.files[0]; fileIn.value = ''; if (f) saveAvatar(f); };

  /* crop to a centred square and shrink, so uploads stay tiny */
  function toSquare(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas');
        cv.width = cv.height = AV_SIZE;
        cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, AV_SIZE, AV_SIZE);
        URL.revokeObjectURL(url);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not process image')), 'image/jpeg', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a supported image')); };
      img.src = url;
    });
  }
  async function clearOld(keep) {
    try {
      const { data } = await nookDb.storage.from(AV_BUCKET).list(me.id);
      const old = (data || []).map(f => me.id + '/' + f.name).filter(p => p !== keep);
      if (old.length) await nookDb.storage.from(AV_BUCKET).remove(old);
    } catch (e) {}
  }
  async function saveAvatar(file) {
    if (!file.type.startsWith('image/')) return toast('Please choose an image');
    if (file.size > AV_MAX_IN) return toast('Image is over 15 MB');
    $('pfChange').disabled = true; toast('Uploading photo…');
    try {
      const blob = await toSquare(file), path = me.id + '/' + Date.now() + '.jpg';
      const up = await nookDb.storage.from(AV_BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (up.error) throw up.error;
      const url = nookDb.storage.from(AV_BUCKET).getPublicUrl(path).data.publicUrl;
      const { error } = await nookDb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
      if (error) throw error;
      avatars[me.id] = url; clearOld(path); repaint();
      $('pfRemove').style.display = ''; toast('Profile photo updated');
    } catch (err) { toast('Could not save photo: ' + (err.message || err)); }
    $('pfChange').disabled = false;
  }
  $('pfRemove').onclick = async () => {
    const { error } = await nookDb.from('profiles').update({ avatar_url: null }).eq('id', me.id);
    if (error) return toast('Could not remove photo: ' + error.message);
    delete avatars[me.id]; clearOld(null); repaint(); $('pfRemove').style.display = 'none'; toast('Photo removed');
  };
})();
</script>

<!-- ===== Added feature: group admins (add/remove members, make admin, rename, description, group photo) ===== -->
<script>
(function () {
  'use strict';
  const GBUCKET = 'avatars', GSIZE = 256, GMAX_IN = 15 * 1024 * 1024;
  const ge = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const isAdmin = (c, id) => !!(c && c.roles && c.roles[id] === 'admin');
  const setUrlAv = (node, url, fb) => {
    if (!node) return;
    if (url) { node.style.backgroundImage = 'url("' + String(url).replace(/"/g, '%22') + '")'; node.textContent = ''; }
    else { node.style.backgroundImage = ''; if (fb != null) node.textContent = fb; }
  };
  let infoChat = null;

  const css = document.createElement('style');
  css.textContent = `
#iOverlay .dialog{max-height:92vh;overflow-y:auto}
.member{flex-wrap:wrap}
.gav{width:88px;height:88px;margin:0 auto 10px;font-size:36px;font-family:var(--head);font-weight:800;display:none}
#gDesc{display:none}
#gDesc .gd{color:var(--muted);font-size:14px;line-height:1.4;white-space:pre-wrap;margin:4px 0 10px;overflow-wrap:anywhere}
.gtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mact{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:54px}
.pchip.rm{background:#fde7e4;color:#a8281b}
html[data-theme="dark"] .pchip.rm{background:#4a1f1b;color:#ffb4aa}`;
  document.head.appendChild(css);

  /* ---------- extra pieces inside the existing info dialog ---------- */
  const dialog = $('iOverlay').querySelector('.dialog');
  const gav = ge('div', 'avatar gav t-group'); gav.id = 'gAv'; dialog.insertBefore(gav, $('iTitle'));
  const gdesc = ge('div'); gdesc.id = 'gDesc';
  const gdText = ge('div', 'gd'), tools = ge('div', 'gtools');
  gdesc.append(gdText, tools); $('iHint').after(gdesc);
  const mkTool = (txt, fn, cls) => { const b = ge('button', 'pchip' + (cls ? ' ' + cls : ''), txt); b.type = 'button'; b.onclick = fn; tools.appendChild(b); return b; };
  const addBtn = ge('button', 'pchip', '＋ Add members'); addBtn.type = 'button'; addBtn.style.margin = '0 0 6px'; addBtn.style.display = 'none';
  $('iMembers').before(addBtn);
  const fileIn = ge('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.hidden = true; document.body.appendChild(fileIn);

  /* ---------- database calls (all go through admin-checked functions) ---------- */
  async function call(name, args, okMsg) {
    const { error } = await nookDb.rpc(name, args);
    if (error) { toast(error.message); return false; }
    if (okMsg) toast(okMsg);
    await loadChats();
    return true;
  }
  const cur = () => (infoChat && byId[infoChat.id]) || null;

  mkTool('Edit name', async () => {
    const c = cur(); if (!c) return;
    const v = prompt('Group name', c.name); if (v === null) return;
    const t = v.trim().slice(0, 60); if (!t) return toast('Name cannot be empty');
    call('group_update', { p_cid: c.id, p_name: t }, 'Group name updated');
  });
  mkTool('Edit description', async () => {
    const c = cur(); if (!c) return;
    const v = prompt('Group description', c.desc || ''); if (v === null) return;
    call('group_update', { p_cid: c.id, p_description: v.trim().slice(0, 500) }, 'Description updated');
  });
  mkTool('Change photo', () => fileIn.click());
  const rmPhoto = mkTool('Remove photo', async () => {
    const c = cur(); if (!c) return;
    if (await call('group_update', { p_cid: c.id, p_clear_avatar: true }, 'Group photo removed')) clearOldGroupPhotos(c.id, null);
  }, 'rm');

  function toSquare(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas');
        cv.width = cv.height = GSIZE;
        cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, GSIZE, GSIZE);
        URL.revokeObjectURL(url);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not process image')), 'image/jpeg', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a supported image')); };
      img.src = url;
    });
  }
  async function clearOldGroupPhotos(cid, keep) {
    try {
      const folder = 'groups/' + cid;
      const { data } = await nookDb.storage.from(GBUCKET).list(folder);
      const old = (data || []).map(f => folder + '/' + f.name).filter(p => p !== keep);
      if (old.length) await nookDb.storage.from(GBUCKET).remove(old);
    } catch (e) {}
  }
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; fileIn.value = ''; const c = cur();
    if (!f || !c) return;
    if (!f.type.startsWith('image/')) return toast('Please choose an image');
    if (f.size > GMAX_IN) return toast('Image is over 15 MB');
    toast('Uploading group photo…');
    try {
      const blob = await toSquare(f), path = 'groups/' + c.id + '/' + Date.now() + '.jpg';
      const up = await nookDb.storage.from(GBUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (up.error) throw up.error;
      const url = nookDb.storage.from(GBUCKET).getPublicUrl(path).data.publicUrl;
      if (await call('group_update', { p_cid: c.id, p_avatar: url }, 'Group photo updated')) clearOldGroupPhotos(c.id, path);
    } catch (err) { toast('Could not save photo: ' + (err.message || err)); }
  };

  /* ---------- add members dialog ---------- */
  const ao = ge('div', 'overlay'); ao.id = 'gaOv'; ao.setAttribute('role', 'dialog'); ao.setAttribute('aria-modal', 'true'); ao.setAttribute('aria-label', 'Add members');
  ao.innerHTML = '<div class="dialog"><h3>Add members</h3><div class="chips" id="gaChips"></div><input id="gaQ" placeholder="Search by name or username" autocomplete="off" style="margin-top:10px"><div class="results" id="gaRes"><p class="hint">Type at least 2 letters.</p></div><div class="actions"><button class="close" id="gaCancel" type="button" style="float:none">Cancel</button><button class="primary" id="gaGo" type="button">Add</button></div></div>';
  document.body.appendChild(ao);
  const gaPick = new Map(); let gaTimer;
  function drawGa() {
    const b = $('gaChips'); b.innerHTML = '';
    gaPick.forEach((u, id) => {
      const c = ge('button', 'pchip', u.full_name + ' ✕'); c.type = 'button'; c.setAttribute('aria-label', 'Remove ' + u.full_name);
      c.onclick = () => { gaPick.delete(id); drawGa(); }; b.appendChild(c);
    });
  }
  addBtn.onclick = () => {
    gaPick.clear(); drawGa(); $('gaQ').value = ''; $('gaRes').innerHTML = '<p class="hint">Type at least 2 letters.</p>';
    ao.classList.add('open'); $('gaQ').focus();
  };
  $('gaQ').addEventListener('input', () => {
    clearTimeout(gaTimer);
    gaTimer = setTimeout(() => runSearch('gaQ', 'gaRes', u => {
      const c = cur();
      if (c && c.members[u.id]) return toast(u.full_name + ' is already in this group');
      gaPick.set(u.id, u); drawGa(); $('gaQ').value = ''; $('gaRes').innerHTML = '<p class="hint">Added to the list. Search for more people.</p>'; $('gaQ').focus();
    }), 250);
  });
  $('gaCancel').onclick = () => ao.classList.remove('open');
  ao.addEventListener('click', e => { if (e.target === ao) ao.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') ao.classList.remove('open'); });
  $('gaGo').onclick = async () => {
    const c = cur(); if (!c) return;
    if (!gaPick.size) return toast('Pick at least one person');
    $('gaGo').disabled = true;
    const n = gaPick.size, ok = await call('group_add_members', { p_cid: c.id, p_users: [...gaPick.keys()] }, n + (n === 1 ? ' person added' : ' people added'));
    $('gaGo').disabled = false;
    if (ok) ao.classList.remove('open');
  };

  /* ---------- the info dialog for groups ---------- */
  const _oi = window.openInfo;
  window.openInfo = function (c) {
    _oi(c); infoChat = c;
    const isG = c.type === 'group';
    gav.style.display = isG ? 'grid' : 'none'; gdesc.style.display = isG ? 'block' : 'none'; addBtn.style.display = 'none';
    if (!isG) return;
    const admin = isAdmin(c, me.id), n = Object.keys(c.members).length;
    setUrlAv(gav, c.gavatar, initial(c.name));
    gdText.textContent = c.desc || (admin ? 'No description yet.' : 'No description.');
    tools.style.display = admin ? 'flex' : 'none'; rmPhoto.style.display = c.gavatar ? '' : 'none';
    addBtn.style.display = admin ? '' : 'none';
    $('iHint').textContent = 'Group · ' + n + (n === 1 ? ' person' : ' people') + (admin ? ' · you are an admin' : '');

    const ids = Object.entries(c.members).sort((a, b) => (b[0] === c.owner) - (a[0] === c.owner)).map(x => x[0]);
    const box = $('iMembers'), rows = [...box.querySelectorAll('.member')];
    const pairs = rows.map((row, i) => [row, ids[i]]).filter(p => p[1]);
    pairs.forEach(([row, id]) => {
      if (isAdmin(c, id) && id !== c.owner) row.appendChild(ge('span', 'tag', 'Admin'));
      if (admin && id !== me.id && id !== c.owner) {
        const nm = c.members[id].name, act = ge('div', 'mact');
        const mk = (txt, fn, cls) => { const b = ge('button', 'pchip' + (cls ? ' ' + cls : ''), txt); b.type = 'button'; b.onclick = fn; act.appendChild(b); };
        if (isAdmin(c, id)) mk('Dismiss as admin', () => call('group_set_admin', { p_cid: c.id, p_user: id, p_admin: false }, nm + ' is no longer an admin'));
        else mk('Make admin', () => call('group_set_admin', { p_cid: c.id, p_user: id, p_admin: true }, nm + ' is now an admin'));
        mk('Remove', () => { if (confirm('Remove ' + nm + ' from "' + c.name + '"?')) call('group_remove_member', { p_cid: c.id, p_user: id }, nm + ' removed'); }, 'rm');
        row.appendChild(act);
      }
    });
    const rank = id => id === c.owner ? 0 : isAdmin(c, id) ? 1 : 2;
    pairs.map((p, i) => [p, i]).sort((a, b) => rank(a[0][1]) - rank(b[0][1]) || a[1] - b[1]).forEach(([p]) => box.appendChild(p[0]));
  };

  /* leaving a group goes through a function that hands over admin if needed */
  const prevLeave = $('iLeave').onclick;
  $('iLeave').onclick = async () => {
    const c = active;
    if (!c || c.type !== 'group') return prevLeave && prevLeave();
    if (!confirm('Leave "' + c.name + '"?')) return;
    const { error } = await nookDb.rpc('leave_group', { p_cid: c.id });
    if (error) return toast('Could not leave: ' + error.message);
    $('iOverlay').classList.remove('open');
    active = null; $('head').style.display = $('msgs').style.display = $('composer').style.display = $('ro').style.display = 'none';
    $('none').style.display = ''; $('app').classList.remove('show-chat');
    await loadChats(); toast('You left ' + c.name);
  };

  /* ---------- group photo, roles and description in the lists ---------- */
  async function loadMeta() {
    const gs = chats.filter(c => c.type === 'group'); if (!gs.length) return;
    const ids = gs.map(c => c.id);
    const [r, g] = await Promise.all([
      nookDb.from('conversation_members').select('conversation_id,user_id,role').in('conversation_id', ids),
      nookDb.from('conversations').select('id,description,avatar_url').in('id', ids)
    ]);
    if (!r.error && r.data) {
      gs.forEach(c => { c.roles = {}; });
      r.data.forEach(x => { const c = byId[x.conversation_id]; if (c) c.roles[x.user_id] = x.role; });
    }
    if (!g.error && g.data) g.data.forEach(x => { const c = byId[x.id]; if (c) { c.desc = x.description || ''; c.gavatar = x.avatar_url || ''; } });
  }
  function checkActive() {
    if (active && !byId[active.id]) {
      const n = active.name; active = null;
      $('head').style.display = $('msgs').style.display = $('composer').style.display = $('ro').style.display = 'none';
      $('none').style.display = ''; $('app').classList.remove('show-chat'); $('iOverlay').classList.remove('open');
      toast('You are no longer in ' + n);
    }
  }
  const _rl = window.renderList;
  window.renderList = function () {
    _rl();
    const q = $('q').value.trim().toLowerCase();
    const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
    document.querySelectorAll('#list .item').forEach((it, i) => {
      const c = rows[i]; if (c && c.type === 'group') setUrlAv(it.querySelector('.avatar'), c.gavatar, initial(c.name));
    });
  };
  const _uh = window.updateHeader;
  window.updateHeader = function () {
    _uh();
    if (!active) return;
    $('hName').textContent = active.name;
    if (active.type === 'group') setUrlAv($('hAvatar'), active.gavatar, initial(active.name));
    else if (active.type !== 'direct') setUrlAv($('hAvatar'), '', initial(active.name));
  };

  let wired = false;
  const _lc = window.loadChats;
  window.loadChats = async function () {
    await _lc();
    try { await loadMeta(); } catch (e) {}
    checkActive(); renderList(); updateHeader();
    if ($('iOverlay').classList.contains('open') && infoChat && byId[infoChat.id]) window.openInfo(byId[infoChat.id]);
    if (wired) return; wired = true;
    // other people's group changes (members, roles, name, photo) show up live
    let t; const soon = () => { clearTimeout(t); t = setTimeout(() => loadChats(), 500); };
    try {
      nookDb.channel('nook-groups')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, soon)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'conversation_members' }, soon)
        .subscribe();
    } catch (e) {}
  };
})();
</script>
</body>
</html>
