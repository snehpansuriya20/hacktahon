<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nook: chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121A33; --snow:#F4F6FB; --glacier:#9CC7F5; --marigold:#FFB627; --pine:#1F6F5C; --mist:#DDE5F2; --card:#fff; --muted:#5b6688;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--snow);color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--snow);font-family:var(--head);font-weight:800;font-size:28px;z-index:50}
.app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
.app.hidden{visibility:hidden}

/* sidebar */
.side{background:var(--ink);color:var(--snow);display:flex;flex-direction:column;min-height:0}
.me{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--ink);flex:none;background:var(--glacier)}
.me b{display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{opacity:.65}
.me .grow{flex:1;min-width:0}
.icon-btn{border:0;background:rgba(244,246,251,.12);color:var(--snow);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}
.icon-btn:hover{background:rgba(244,246,251,.22)}
.new{position:relative}
.menu{position:absolute;right:0;top:44px;background:var(--card);color:var(--ink);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);z-index:10;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:15px}
.menu button:hover{background:var(--mist)}
.search{padding:6px 18px 12px}
.search input{width:100%;font:15px var(--body);padding:11px 16px;border-radius:999px;border:0;background:rgba(244,246,251,.12);color:var(--snow)}
.search input::placeholder{color:rgba(244,246,251,.55)}
.filters{display:flex;gap:6px;padding:0 18px 12px}
.filters button{flex:1;border:0;padding:8px 4px;border-radius:999px;background:transparent;color:rgba(244,246,251,.7);font-weight:600;font-size:14px}
.filters button[aria-selected="true"]{background:var(--snow);color:var(--ink)}
.list{flex:1;overflow-y:auto;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:12px;border-radius:16px}
.item:hover{background:rgba(244,246,251,.08)}
.item.active{background:rgba(244,246,251,.16)}
.item .mid{flex:1;min-width:0}
.item .row{display:flex;justify-content:space-between;gap:8px}
.item b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time{font-size:12px;opacity:.6;flex:none}
.item .last{font-size:14px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--marigold);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;flex:none}
.empty{padding:24px 16px;opacity:.7;font-size:15px;line-height:1.5}
.t-group{background:var(--marigold)}.t-broadcast{background:#7fd1b9}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--snow)}
.head{display:none;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--mist)}
.head b{display:block;line-height:1.2}
.head small{color:var(--muted)}
.back{display:none;border:0;background:var(--mist);border-radius:12px;padding:8px 12px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:22px;display:none;flex-direction:column;gap:8px}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--mist);padding:4px 12px;border-radius:999px;margin:6px 0}
.hello{margin:auto;color:var(--muted);text-align:center}
.msg{max-width:min(520px,78%);padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop .25s cubic-bezier(.2,1.4,.4,1) both;transform-origin:bottom;overflow-wrap:anywhere;white-space:pre-wrap}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.msg .who{display:block;font-size:12px;font-weight:600;opacity:.7;margin-bottom:2px}
.msg.them{background:var(--card);border:1px solid var(--mist);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--marigold);border-bottom-right-radius:5px;align-self:flex-end}
.msg.cast{background:var(--pine);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
.composer{display:none;gap:10px;padding:14px 22px;background:var(--card);border-top:1px solid var(--mist)}
.composer input{flex:1;font:16px var(--body);padding:13px 18px;border-radius:999px;border:2px solid var(--mist);background:var(--snow);color:var(--ink)}
.composer input:focus{outline:none;border-color:var(--glacier)}
.send{border:0;border-radius:999px;background:var(--ink);color:var(--snow);font-weight:600;font-size:16px;padding:0 24px}
.send:hover{background:#26325c}
.send:disabled{opacity:.5}
.none{margin:auto;text-align:center;color:var(--muted);max-width:26em;padding:24px}
.none h2{font-family:var(--head);font-size:28px;color:var(--ink);margin-bottom:6px}

/* new chat dialog + toast */
.overlay{position:fixed;inset:0;background:rgba(18,26,51,.55);display:none;place-items:center;z-index:40;padding:16px}
.overlay.open{display:grid}
.dialog{background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.dialog h3{font-family:var(--head);font-size:24px;font-weight:800;margin-bottom:12px}
.dialog input{width:100%;font:16px var(--body);padding:13px 16px;border-radius:14px;border:2px solid var(--mist);background:var(--snow);color:var(--ink)}
.dialog input:focus{outline:none;border-color:var(--glacier)}
.results{margin:10px 0;max-height:300px;overflow-y:auto;min-height:40px}
.result{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:14px}
.result:hover{background:var(--mist)}
.result small{display:block;color:var(--muted)}
.hint{color:var(--muted);padding:10px;font-size:15px}
.close{border:0;background:var(--mist);border-radius:999px;padding:10px 18px;font-weight:600;float:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;z-index:60;display:none}

.msg{cursor:pointer}
.msg.sticker{background:none;border:0;padding:2px 6px}.msg.sticker .big{font-size:64px;line-height:1.15}
.msg.gif{padding:4px;background:var(--card);border:1px solid var(--mist);color:var(--ink)}.msg.gif img{display:block;max-width:240px;width:100%;border-radius:14px}
.msg.flash{box-shadow:0 0 0 3px var(--glacier)}
.quote{border-left:3px solid var(--pine);background:rgba(18,26,51,.08);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:13px}
.quote b{display:block;font-size:12px}.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;opacity:.8}
.msg.cast .quote{border-left-color:var(--marigold);background:rgba(255,255,255,.15)}
.reacts{display:flex;flex-wrap:wrap;gap:4px}.reacts:not(:empty){margin-top:6px}
.chip{border:1px solid rgba(18,26,51,.2);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:13px}
.chip.mine{border-color:var(--ink);font-weight:600;background:var(--card)}
.bar{position:fixed;display:none;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);z-index:30}
.bar button{border:0;background:none;font-size:22px;border-radius:999px;padding:4px 7px}.bar button:hover{background:var(--mist)}
.bar .rep{font-size:14px;font-weight:600;padding:4px 12px}
.replybar{display:none;align-items:center;gap:10px;padding:8px 22px;background:var(--card);border-top:1px solid var(--mist)}
.replybar .rq{flex:1;min-width:0;border-left:3px solid var(--pine);padding-left:10px;font-size:13px}
.replybar b{display:block}.replybar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.replybar button{border:0;background:var(--mist);border-radius:999px;width:32px;height:32px}
.ro{display:none;text-align:center;padding:16px;background:var(--card);border-top:1px solid var(--mist);color:var(--muted)}
.picker{display:none;background:var(--card);border-top:1px solid var(--mist);padding:10px 22px;height:280px;flex-direction:column}
.picker.open{display:flex}
.ptabs{display:flex;gap:6px;margin-bottom:8px}.ptabs button{border:0;border-radius:999px;padding:6px 16px;background:var(--mist);font-weight:600}
.ptabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;min-height:0}.pbody[hidden]{display:none}
.stk{border:0;background:none;font-size:34px;padding:6px;border-radius:12px}.stk:hover{background:var(--mist)}
.pbody input{width:100%;font:15px var(--body);padding:9px 14px;border-radius:999px;border:2px solid var(--mist);margin-bottom:8px}
.gifgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gifgrid button{border:0;background:var(--mist);border-radius:10px;overflow:hidden;padding:0}.gifgrid img{display:block;width:100%;height:90px;object-fit:cover}
.gpaste{display:flex;gap:6px;margin-top:8px}.gpaste input{margin:0}.gpaste button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:0 16px;font-weight:600}
.tool{border:0;background:var(--mist);border-radius:999px;width:46px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pchip{border:0;background:var(--mist);border-radius:999px;padding:5px 12px;font-size:14px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.primary{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;padding:10px 22px}.primary:disabled{opacity:.5}
/* ---- part 3 additions ---- */
.avatar{position:relative}
.avatar.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#2fd17b;border:2px solid var(--ink)}
.head .avatar.on::after{border-color:var(--card)}
.head{cursor:default}.head.info{cursor:pointer}
.head small.typing,.last.typing{color:var(--pine);font-style:italic;opacity:1}
.side .last.typing{color:#7fd1b9}
.msg a{color:inherit;text-decoration:underline}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:rgba(18,26,51,.12);padding:0 5px;border-radius:5px}
.mention{font-weight:700;color:var(--pine)}.mention.self{background:rgba(255,182,39,.35);border-radius:5px;padding:0 3px}
.msg.cast .mention{color:var(--marigold)}
.msg.emo{font-size:36px;line-height:1.2;padding:6px 12px}
.bar{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:22px}
.bar .rep.del{color:#c0392b}
.egroups{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}.egroups button{border:0;background:var(--mist);border-radius:999px;padding:3px 10px;font-size:18px}
.egroups button[aria-selected="true"]{background:var(--marigold)}
.egrid{display:flex;flex-wrap:wrap}.egrid .stk{font-size:26px;padding:4px 6px}
.member{display:flex;align-items:center;gap:12px;padding:8px 4px}.member small{display:block;color:var(--muted)}
.member .tag{margin-left:auto;font-size:12px;font-weight:700;background:var(--marigold);color:var(--ink);border-radius:999px;padding:2px 10px}
.minfo{max-height:300px;overflow-y:auto;margin:8px 0 12px}
.danger{border:0;border-radius:999px;background:#fde7e4;color:#a8281b;font-weight:600;padding:10px 20px}
html[data-theme="dark"]{--snow:#0b1021;--mist:#26304f;--card:#151c36;--muted:#9eaad0}
html[data-theme="dark"] body{color:#e8ecf8}
html[data-theme="dark"] .msg.me{color:#121A33}
html[data-theme="dark"] .mention{color:#7fd1b9}
html[data-theme="dark"] .msg.me .mention{color:#121A33}
html[data-theme="dark"] .menu,html[data-theme="dark"] .none h2,html[data-theme="dark"] .msg.gif{color:#e8ecf8}
html[data-theme="dark"] .composer input,html[data-theme="dark"] .pbody input,html[data-theme="dark"] .dialog input{color:#e8ecf8}
html[data-theme="dark"] .side{color:#F4F6FB}
html[data-theme="dark"] .icon-btn,html[data-theme="dark"] .search input{color:#F4F6FB}
html[data-theme="dark"] .filters button[aria-selected="true"]{background:#F4F6FB;color:#121A33}
html[data-theme="dark"] .send{color:#F4F6FB;background:#2b3a6e}
html[data-theme="dark"] .msg.them{border-color:var(--mist)}
html[data-theme="dark"] .danger{background:#4a1f1b;color:#ffb4aa}
@media (max-width:860px){
  .replybar,.picker{padding-left:14px;padding-right:14px}
  .app{grid-template-columns:1fr}
  .main{display:none}
  .app.show-chat .side{display:none}
  .app.show-chat .main{display:flex}
  .back{display:block}
  .msgs,.head,.composer{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Himalayan night theme to match the Nook IIT Mandi landing page ===== */
.side{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(165deg,#101b34 0%,#0a1224 62%,#07101d 100%)}
.side>*{position:relative;z-index:1}
/* Keep the profile/New dropdown above the search bar and chat filters. */
.side>.me{z-index:20}
.new{z-index:30}
.new .menu{z-index:100}
.side::after{content:"";position:absolute;z-index:0;pointer-events:none;left:-8%;right:-8%;bottom:-2px;height:145px;opacity:.25;background:linear-gradient(180deg,#47627e,#172b43);clip-path:polygon(0 60%,10% 38%,19% 57%,31% 13%,43% 56%,54% 29%,66% 60%,78% 8%,89% 49%,100% 28%,100% 100%,0 100%)}
.main{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#0a0e1c 0%,#101a30 58%,#15243a 100%);color:#f4f6fb}
.main>*{position:relative;z-index:1}
.main::before,.main::after{content:"";position:absolute;z-index:0;pointer-events:none;left:-5%;right:-5%;bottom:0;transform-origin:bottom center}
.main::before{height:44%;opacity:.36;background:linear-gradient(165deg,#6d829b 0%,#293e59 58%,#14263d 100%);clip-path:polygon(0 72%,8% 51%,16% 62%,27% 16%,36% 54%,47% 7%,58% 56%,69% 22%,79% 59%,89% 14%,100% 46%,100% 100%,0 100%)}
.main::after{height:29%;opacity:.55;background:linear-gradient(180deg,#314962 0%,#0a1425 90%);clip-path:polygon(0 48%,13% 28%,24% 55%,37% 12%,49% 52%,61% 30%,74% 58%,86% 17%,100% 45%,100% 100%,0 100%)}
.head,.composer,.replybar,.ro,.picker{background:rgba(10,16,32,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-color:rgba(221,229,242,.12);color:#f4f6fb}
.head small,.replybar .rq span,.ro{color:#aab8d0}
.msgs{background:transparent;scrollbar-color:rgba(156,199,245,.35) transparent}
.hello,.none{color:#bdc9df}
.none h2{color:#f4f6fb}
.day{background:rgba(156,199,245,.16);color:#dbe7f7;border:1px solid rgba(156,199,245,.16)}
.msg.them{background:rgba(28,43,68,.92);color:#f4f6fb;border-color:rgba(156,199,245,.18);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.msg.me{background:#e9c58a;color:#10182a;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.msg.cast{background:#1f6f5c;color:#fff}
.composer input{background:rgba(244,246,251,.07);border-color:rgba(221,229,242,.18);color:#f4f6fb}
.composer input::placeholder{color:#94a3bd}
.composer input:focus{border-color:#9cc7f5;box-shadow:0 0 0 3px rgba(156,199,245,.16)}
.send{background:#f4f6fb;color:#121a33;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.send:hover{background:#dceafa;transform:translateY(-1px);box-shadow:0 8px 22px rgba(156,199,245,.18)}
.back{background:rgba(156,199,245,.16);color:#f4f6fb}
.msg .quote{background:rgba(255,255,255,.08)}
.msg a,.mention{color:#b8d9ff}
.msg.me .mention{color:#121a33}
.loading{background:#0a0e1c;color:#f4f6fb;letter-spacing:-.04em}
.loading::after{content:"";width:7px;height:7px;margin-left:2px;display:inline-block;vertical-align:middle;border-radius:50%;background:#e9c58a;box-shadow:0 0 18px rgba(233,197,138,.45)}
.icon-btn{background:rgba(156,199,245,.12);border:1px solid rgba(156,199,245,.1);transition:background .2s ease,transform .2s ease}
.icon-btn:hover{background:rgba(156,199,245,.23);transform:translateY(-1px)}
.search input{background:rgba(244,246,251,.08);border:1px solid rgba(221,229,242,.12)}
.item.active{background:linear-gradient(100deg,rgba(156,199,245,.18),rgba(244,246,251,.08));box-shadow:inset 3px 0 #e9c58a}
.item:hover{background:rgba(156,199,245,.1)}
.badge,.member .tag{background:#e9c58a}
.dialog,.menu,.bar,.attm{background:#111b31;color:#f4f6fb;border:1px solid rgba(221,229,242,.14)}
.menu button,.attm button{color:#f4f6fb}
.menu button:hover,.attm button:hover,.result:hover{background:rgba(156,199,245,.14)}
.dialog input,.pbody input{background:rgba(244,246,251,.07);border-color:rgba(221,229,242,.18);color:#f4f6fb}
.close,.tool,.pchip,.ptabs button{background:rgba(156,199,245,.16);color:#f4f6fb}
.ptabs button[aria-selected="true"],.primary{background:#e9c58a;color:#121a33}
.toast{background:#e9c58a;color:#121a33}
html[data-theme="light"] .main{background:linear-gradient(180deg,#edf3fb 0%,#dce8f5 58%,#c7d7e9 100%);color:#121a33}
html[data-theme="light"] .main::before{opacity:.26;background:linear-gradient(165deg,#aebed0,#7f98b5 70%,#6b839e)}
html[data-theme="light"] .main::after{opacity:.3;background:linear-gradient(180deg,#718aa7,#435c79)}

/* ===== Refined, photorealistic Himalayan atmosphere ===== */
:root{--nook-ice:#c9e0f7;--nook-gold:#e9c58a}
html[data-theme="dark"] body{background:#08111f}
html[data-theme="dark"] .side{
  background:linear-gradient(180deg,rgba(7,16,31,.94),rgba(8,17,31,.97)),
    url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=85') center/cover no-repeat;
  border-right:1px solid rgba(213,229,248,.09)
}
html[data-theme="dark"] .main{
  background-color:#0a1425;
  background-image:linear-gradient(180deg,rgba(7,14,29,.62) 0%,rgba(9,20,37,.48) 42%,rgba(8,18,32,.82) 100%),
    linear-gradient(90deg,rgba(5,12,24,.18),transparent 35%,rgba(5,12,24,.12)),
    url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=90');
  background-position:center,center,center 48%;background-size:cover,cover,cover;background-repeat:no-repeat;
}
/* Let the real mountain photograph lead; keep the CSS ridges as distant atmospheric depth. */

/* Calm light mode with a misty alpine look, too. */

  html[data-theme="dark"] .main{background-position:center,center,58% center}
  html[data-theme="light"] .main{background-position:center,58% center}
}

<body>

<div class="loading" id="loading">nook</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="me">
      <div class="avatar" id="meAvatar">?</div>
      <div class="grow"><b id="meName">...</b><small id="meUser"></small></div>
      <div class="new">
        <button class="icon-btn" id="newBtn" aria-haspopup="true">New</button>
        <div class="menu" id="newMenu" role="menu">
          <button role="menuitem" data-new="direct">New chat</button>
          <button role="menuitem" data-new="group">New group</button>
          <button role="menuitem" data-new="broadcast">New broadcast</button>
          <button role="menuitem" id="themeBtn">Dark mode</button>
          <button role="menuitem" id="soundBtn">Sound: on</button>
        </div>
      </div>
      <button class="icon-btn" id="logout">Log out</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search your chats" aria-label="Search your chats"></div>
    <div class="filters" role="tablist">
      <button role="tab" aria-selected="true" data-f="all">All</button>
      <button role="tab" aria-selected="false" data-f="direct">Direct</button>
      <button role="tab" aria-selected="false" data-f="group">Groups</button>

    </div>
    <div class="list" id="list"></div>

  <section class="main" id="main">
    <div class="none" id="none"><h2>Pick a chat</h2><p>Choose a conversation on the left, or press New to find someone by username.</p></div>

      <button class="back" id="back">Back</button>

      <div><b id="hName"></b><small id="hSub"></small></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="replybar" id="replyBar"><div class="rq"><b id="rName"></b><span id="rText"></span></div><button type="button" id="rCancel" aria-label="Cancel reply">&#10005;</button></div>
    <div class="picker" id="picker">
      <div class="ptabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-p="stickers">Stickers</button><button type="button" role="tab" aria-selected="false" data-p="emoji">Emoji</button><button type="button" role="tab" aria-selected="false" data-p="gifs">GIFs</button></div>
      <div class="pbody" id="pStickers"></div>
      <div class="pbody" id="pEmoji" hidden><div class="egroups" id="eGroups"></div><div class="egrid" id="eGrid"></div></div>

        <input id="gifQ" type="search" placeholder="Search GIFs (powered by GIPHY)" aria-label="Search GIFs">

</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Start a new chat">
  <div class="dialog">
    <h3>Start a chat</h3>
    <input id="userQ" placeholder="Search by name or username" autocomplete="off">
    <div class="results" id="results"><p class="hint">Type at least 2 letters.</p></div>
    <button class="close" id="closeDlg">Close</button>
  </div>
</div>
<div class="overlay" id="gOverlay" role="dialog" aria-modal="true" aria-label="Create">
  <div class="dialog">
    <h3 id="gTitle">New group</h3>
    <input id="gName" maxlength="60" autocomplete="off">
    <p class="hint" id="gHint"></p>

    <h3 id="iTitle"></h3>
    <p class="hint" id="iHint"></p>
    <div class="minfo" id="iMembers"></div>
    <div class="actions"><button class="close" id="iClose" type="button" style="float:none">Close</button><button class="danger" id="iLeave" type="button">Leave</button></div>
  </div>
</div>
<div class="bar" id="bar" role="toolbar" aria-label="Message actions"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const initial = s => (s || '?').trim().charAt(0).toUpperCase();
let me = null, chats = [], byId = {}, active = null, filter = 'all';
let online = new Set(), live = null, soundOn = true;
const GIPHY_KEY = '';   // free key from developers.giphy.com enables GIF search

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.id); toast.id = setTimeout(() => t.style.display = 'none', 3200);
}
function fmt(iso){
  const d = new Date(iso), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
    : d.toLocaleDateString([], {day:'numeric', month:'short'});
}
const sortChats = () => chats.sort((a,b) =>
  new Date(b.last ? b.last.created_at : b.created) - new Date(a.last ? a.last.created_at : a.created));

/* ---------- Load conversations from the database ---------- */
async function loadChats(){
  const mine = await nookDb.from('conversation_members')
    .select('conversation_id, conversations(id,type,name,created_at,created_by)')
    .eq('user_id', me.id);
  if(mine.error){ toast('Could not load chats: ' + mine.error.message); return; }
  const ids = mine.data.map(r => r.conversation_id);
  if(!ids.length){ chats = []; byId = {}; renderList(); return; }

  const [mem, lastMsgs] = await Promise.all([
    nookDb.from('conversation_members').select('conversation_id,user_id,profiles(full_name,username)').in('conversation_id', ids),
    nookDb.from('messages').select('id,conversation_id,sender_id,body,kind,created_at')
      .in('conversation_id', ids).order('created_at', {ascending:false}).limit(300)
  ]);

  const old = byId; byId = {};
  chats = mine.data.map(r => {
    const c = r.conversations;
    const members = {};
    (mem.data || []).filter(m => m.conversation_id === c.id).forEach(m => {
      members[m.user_id] = { name: m.profiles ? m.profiles.full_name : 'Unknown', username: m.profiles ? m.profiles.username : '' };
    });
    const otherId = Object.keys(members).find(id => id !== me.id);
    const obj = old[c.id] || { id: c.id, msgs: [], loaded: false, unread: 0, last: null };
    obj.type = c.type; obj.owner = c.created_by; obj.members = members; obj.other = otherId; obj.created = c.created_at;
    obj.name = c.type === 'direct' ? (otherId ? members[otherId].name : 'Chat') : (c.name || 'Group');
    const n = Object.keys(members).length;
    obj.sub = c.type === 'direct'
      ? (otherId && members[otherId].username ? '@' + members[otherId].username : '')
      : c.type === 'broadcast'
        ? (c.created_by === me.id ? (n - 1) + ' recipients' : 'Broadcast by ' + (members[c.created_by] ? members[c.created_by].name : 'someone'))
        : n + ' members';
    obj.last = (lastMsgs.data || []).find(m => m.conversation_id === c.id) || obj.last;
    byId[c.id] = obj;
    return obj;
  });
  sortChats(); renderList();
}

/* ---------- Sidebar list ---------- */
function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
  const list = $('list'); list.innerHTML = '';
  const totalUnread = chats.reduce((a, c) => a + (c.unread || 0), 0);
  document.title = (totalUnread ? '(' + totalUnread + ') ' : '') + 'Nook: chats';
  if(!rows.length){
    list.innerHTML = '<p class="empty">' + (chats.length ? 'Nothing matches.' : 'No chats yet. Press New to find a friend by username.') + '</p>';
    return;
  }
  rows.forEach(c => {
    const b = document.createElement('button');
    b.className = 'item' + (active && active.id === c.id ? ' active' : '');
    b.innerHTML = '<div class="avatar t-' + c.type + '"></div><div class="mid"><div class="row"><b></b><time></time></div><div class="row"><span class="last"></span></div></div>';
    b.querySelector('.avatar').textContent = initial(c.name);
    b.querySelector('b').textContent = c.name;
    b.querySelector('time').textContent = c.last ? fmt(c.last.created_at) : '';
    const lastEl = b.querySelector('.last'), tt = typingText(c);
    lastEl.textContent = tt || (c.last ? (c.last.sender_id === me.id ? 'You: ' : '') + snippet(c.last) : 'Say hello');
    if(tt) lastEl.classList.add('typing');
    if(c.type === 'direct' && online.has(c.other)) b.querySelector('.avatar').classList.add('on');
    if(c.unread){ const u = document.createElement('span'); u.className = 'badge'; u.textContent = c.unread; b.querySelector('.row:last-child').appendChild(u); }
    b.onclick = () => openChat(c);
    list.appendChild(b);
  });
}
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-selected', x === b));
  renderList();
});
$('q').addEventListener('input', renderList);

/* ---------- Message area ---------- */
function addBubble(c, m){
  const box = $('msgs');
  const h = box.querySelector('.hello'); if(h) h.remove();
  const prev = c.msgs[c.msgs.indexOf(m) - 1];
  if(!prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString()){
    const d = document.createElement('div'); d.className = 'day';
    d.textContent = new Date(m.created_at).toDateString() === new Date().toDateString() ? 'Today'
      : new Date(m.created_at).toLocaleDateString([], {day:'numeric', month:'long'});
    box.appendChild(d);
  }
  const mine = m.sender_id === me.id, kind = m.kind || 'text';
  const el = document.createElement('div'); el.dataset.id = m.id; el.tabIndex = 0;
  el.className = 'msg ' + (mine ? (c.type === 'broadcast' ? 'cast' : 'me') : 'them') + (kind !== 'text' ? ' ' + kind : '');
  if(c.type === 'group' && !mine){
    const w = document.createElement('span'); w.className = 'who'; w.textContent = nameOf(c, m.sender_id); el.appendChild(w);
  }
  if(m.reply_to) el.appendChild(quoteEl(c, m.reply_to));
  if(kind === 'sticker'){ const s = document.createElement('div'); s.className = 'big'; s.textContent = m.body; el.appendChild(s); }
  else if(kind === 'gif' && safeUrl(m.body)){
    const i = new Image(); i.alt = 'GIF'; i.referrerPolicy = 'no-referrer'; i.src = m.body;
    i.onload = () => { if(box.scrollHeight - box.scrollTop - box.clientHeight < 500) box.scrollTop = box.scrollHeight; };
    el.appendChild(i);
  } else if(kind === 'gif') el.appendChild(document.createTextNode('GIF unavailable'));
  else { el.appendChild(rich(m.body, c)); if(isEmojiOnly(m.body)) el.classList.add('emo'); }
  const t = document.createElement('small'); t.textContent = fmt(m.created_at); el.appendChild(t);
  const rx = document.createElement('div'); rx.className = 'reacts'; el.appendChild(rx);
  box.appendChild(el); renderReacts(m);
}
async function openChat(c){
  if(active) active.draft = $('text').value;
  active = c; c.unread = 0; $('text').value = c.draft || '';
  $('none').style.display = 'none';
  $('head').style.display = 'flex'; $('msgs').style.display = 'flex'; $('composer').style.display = canPost(c) ? 'flex' : 'none'; $('ro').style.display = canPost(c) ? 'none' : 'block'; clearReply(); $('picker').classList.remove('open'); hideBar();
  $('hName').textContent = c.name; $('head').classList.toggle('info', c.type !== 'direct'); updateHeader();
    $('app').classList.add('show-chat');
  renderList();

  const box = $('msgs'); box.innerHTML = '';
  if(!c.loaded){
    const { data, error } = await nookDb.from('messages').select('id,conversation_id,sender_id,body,kind,reply_to,created_at,message_reactions(user_id,emoji)')
      .eq('conversation_id', c.id).order('created_at', {ascending:false}).limit(300);
    if(error){ toast('Could not load messages'); return; }
    c.msgs = data.reverse().map(norm); c.loaded = true;
  }
  if(active !== c) return;               // user switched chats while loading
  if(!c.msgs.length) box.innerHTML = '<p class="hello">No messages yet. Say hello!</p>';
  c.msgs.forEach(m => addBubble(c, m));
  box.scrollTop = box.scrollHeight;
  if(canPost(c)) $('text').focus();
}
$('back').onclick = () => $('app').classList.remove('show-chat');

/* One function handles every new message (sent by me or received live) */
async function handleMessage(m){
  let c = byId[m.conversation_id];
  if(!c){                                  // someone started a new chat with me
    await loadChats(); c = byId[m.conversation_id];
    if(!c) return;
  }
  if(c.loaded && c.msgs.some(x => x.id === m.id)) return;   // already shown
  m.reactions = m.reactions || []; c.last = m;
  if(c.loaded) c.msgs.push(m);
  if(active && active.id === c.id){
    addBubble(c, m); const box = $('msgs'); box.scrollTop = box.scrollHeight;
  } else if(m.sender_id !== me.id){
    c.unread++;
  }
  if(m.sender_id !== me.id && (document.hidden || !active || active.id !== c.id)) beep();
  if(c.typing) delete c.typing[m.sender_id];
  sortChats(); renderList();
}

$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('text').value.trim();
  if(!v || !active) return;
  $('sendBtn').disabled = true;
  const ok = await sendMessage('text', v);
  $('sendBtn').disabled = false;
  if(ok) $('text').value = '';
});

/* ---------- Replies, reactions, stickers, GIFs ---------- */
const canPost = c => c.type !== 'broadcast' || c.owner === me.id;
const nameOf = (c, id) => id === me.id ? 'You' : (c.members[id] ? c.members[id].name : 'Someone');
const safeUrl = u => { try{ return new URL(u).protocol === 'https:'; }catch(e){ return false; } };
const snippet = m => m.kind === 'sticker' ? m.body + ' Sticker' : m.kind === 'gif' ? 'GIF' : m.body;
const norm = m => { m.reactions = m.message_reactions || []; delete m.message_reactions; return m; };
let replyTo = null;

function quoteEl(c, id){
  const q = document.createElement('div'); q.className = 'quote';
  const o = c.msgs.find(x => x.id === id);
  const n = document.createElement('b'); n.textContent = o ? nameOf(c, o.sender_id) : 'Message';
  const t = document.createElement('span'); t.textContent = o ? snippet(o) : 'Original message not available';
  q.append(n, t);
  if(o) q.onclick = e => { e.stopPropagation(); jumpTo(id); };
  return q;
}
function jumpTo(id){
  const el = $('msgs').querySelector('[data-id="' + id + '"]'); if(!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'});
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
}
function setReply(m){
  replyTo = m; $('rName').textContent = nameOf(active, m.sender_id); $('rText').textContent = snippet(m);
  $('replyBar').style.display = 'flex'; $('text').focus();
}
function clearReply(){ replyTo = null; $('replyBar').style.display = 'none'; }
$('rCancel').onclick = clearReply;

async function sendMessage(kind, body){
  if(!active || !canPost(active)) return false;
  const row = { conversation_id: active.id, sender_id: me.id, body, kind };
  if(replyTo) row.reply_to = replyTo.id;
  const { data, error } = await nookDb.from('messages').insert(row).select().single();
  if(error){ toast('Message not sent: ' + error.message); return false; }
  clearReply(); handleMessage(data); return true;
}

function renderReacts(m){
  const el = $('msgs').querySelector('[data-id="' + m.id + '"]'); if(!el) return;
  const box = el.querySelector('.reacts'); box.innerHTML = '';
  const g = {}; m.reactions.forEach(r => (g[r.emoji] = g[r.emoji] || []).push(r.user_id));
  Object.keys(g).forEach(em => {
    const mineR = g[em].includes(me.id);
    const b = document.createElement('button'); b.className = 'chip' + (mineR ? ' mine' : '');
    b.textContent = em + ' ' + g[em].length; b.setAttribute('aria-pressed', mineR);
    b.onclick = e => { e.stopPropagation(); toggleReaction(m, em); };
    box.appendChild(b);
  });
}
async function toggleReaction(m, emoji){
  const has = m.reactions.find(r => r.user_id === me.id && r.emoji === emoji);
  const key = { message_id: m.id, user_id: me.id, emoji };
  if(has){
    m.reactions = m.reactions.filter(r => r !== has); renderReacts(m);
    const { error } = await nookDb.from('message_reactions').delete().match(key);
    if(error){ m.reactions.push(has); renderReacts(m); toast('Could not remove reaction'); }
  } else {
    const r = { ...key }; m.reactions.push(r); renderReacts(m);
    const { error } = await nookDb.from('message_reactions').insert(key);
    if(error){ m.reactions = m.reactions.filter(x => x !== r); renderReacts(m); toast('Could not react'); }
  }
}
function applyReaction(r, add){
  for(const c of chats){
    const m = c.msgs.find(x => x.id === r.message_id); if(!m) continue;
    const i = m.reactions.findIndex(x => x.user_id === r.user_id && x.emoji === r.emoji);
    if(add && i < 0) m.reactions.push({ message_id: r.message_id, user_id: r.user_id, emoji: r.emoji });
    if(!add && i >= 0) m.reactions.splice(i, 1);
    renderReacts(m); return;
  }
}

/* tap a message: react or reply */
const bar = $('bar'); let barFor = null;
function hideBar(){ bar.style.display = 'none'; barFor = null; }
$('msgs').addEventListener('click', e => {
  const el = e.target.closest('.msg'); if(!el || !active) return;
  if(barFor === el.dataset.id){ hideBar(); return; }
  const m = active.msgs.find(x => x.id === el.dataset.id); if(!m) return;
  bar.innerHTML = '';
  ['👍','❤️','😂','😮','😢','🙏'].forEach(em => {
    const b = document.createElement('button'); b.textContent = em; b.setAttribute('aria-label', 'React ' + em);
    b.onclick = () => { hideBar(); toggleReaction(m, em); }; bar.appendChild(b);
  });
  if(canPost(active)){
    const r = document.createElement('button'); r.className = 'rep'; r.textContent = 'Reply';
    r.onclick = () => { hideBar(); setReply(m); }; bar.appendChild(r);
  }
  if((m.kind || 'text') === 'text'){
    const cp = document.createElement('button'); cp.className = 'rep'; cp.textContent = 'Copy';
    cp.onclick = async () => { hideBar(); try{ await navigator.clipboard.writeText(m.body); toast('Copied'); }catch(err){ toast('Could not copy'); } };
    bar.appendChild(cp);
  }

const isEmojiOnly = t => { const x = t.trim(); return x.length > 0 && x.length <= 16 && /^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(x) && Array.from(x.replace(/\s/g, '')).length <= 4; };
function rich(text, c){
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s<]+|`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|_[^_\n]+_|@[A-Za-z0-9]{2,})/g;
  let last = 0, m;
  const add = (tag, str, cls) => { const e = document.createElement(tag); if(cls) e.className = cls; e.textContent = str; frag.appendChild(e); return e; };
  while((m = re.exec(text))){
    if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0]; last = m.index + tok.length;
    if(tok[0] === 'h'){
      const url = tok.replace(/[.,!?)]+$/, ''); last -= tok.length - url.length;
      if(safeUrl(url) || url.startsWith('http://')){ const a = add('a', url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.onclick = e => e.stopPropagation(); }
      else frag.appendChild(document.createTextNode(url));
    } else if(tok[0] === '`') add('code', tok.slice(1, -1));
    else if(tok.startsWith('**')) add('b', tok.slice(2, -2));
    else if(tok[0] === '*' || tok[0] === '_') add('i', tok.slice(1, -1));
    else {
      const uname = tok.slice(1).toLowerCase();
      const hit = Object.entries(c.members).find(([id, u]) => (u.username || '').toLowerCase() === uname);
      if(hit) add('span', tok, 'mention' + (hit[0] === me.id ? ' self' : ''));
      else frag.appendChild(document.createTextNode(tok));
    }
  }
  if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

.popt span{position:relative}.popt.mine{border-color:#121A33;font-weight:600}
.attm{position:fixed;z-index:45;display:none;background:var(--card);color:var(--ink);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
.attm.open{display:block}.attm button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:15px;color:inherit}.attm button:hover{background:var(--mist)}
.popts input{margin-top:8px}.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted)}.chk input{width:auto;margin:0}`;
  document.head.appendChild(css);

  /* ---------- make the messages query also return the new columns ---------- */
  const _from = nookDb.from.bind(nookDb);
  nookDb.from = t => {
    const q = _from(t);
    if (t === 'messages') {
      const s = q.select.bind(q);
      q.select = (cols, o) => s(typeof cols === 'string' && cols.includes('sender_id') ? cols + ',file_path,file_name,file_type,file_size,poll_id' : cols, o);
    }
    return q;
  };

  /* ---------- signed links for private files ---------- */
  async function urlFor(path, dl) {
    const k = path + '|' + (dl || ''), h = signed.get(k);
    if (h && h.t > Date.now()) return h.u;
    const { data, error } = await nookDb.storage.from(BUCKET).createSignedUrl(path, 3600, dl ? { download: dl } : undefined);
    if (error) throw error;
    signed.set(k, { u: data.signedUrl, t: Date.now() + 3300e3 });
    return data.signedUrl;
  }
  const nearBottom = () => { const b = $('msgs'); if (b.scrollHeight - b.scrollTop - b.clientHeight < 500) b.scrollTop = b.scrollHeight; };

  function mediaEl(m) {
    const w = el('div');
    if (!m.file_path) { w.textContent = 'Attachment unavailable'; return w; }
    if (m.kind === 'file') {
      const a = el('a', 'fcard'), d = el('div'); a.href = '#';
      d.append(el('b', '', m.file_name || 'File'), el('small', '', sizeText(m.file_size || 0)));
      a.append(el('span', 'ic', docIcon(m.file_name)), d);
      a.onclick = async e => {
        e.preventDefault(); e.stopPropagation();
        try { const t = el('a'); t.href = await urlFor(m.file_path, m.file_name || true); t.download = m.file_name || ''; document.body.appendChild(t); t.click(); t.remove(); }
        catch (err) { toast('Could not open file'); }
      };
      return a;
    }
    const isImg = m.kind === 'image', n = isImg ? new Image() : el('video');
    if (isImg) { n.alt = m.file_name || 'Photo'; n.onload = nearBottom; }
    else { n.controls = true; n.preload = 'metadata'; n.playsInline = true; n.onloadedmetadata = nearBottom; }
    n.onclick = e => { e.stopPropagation(); if (isImg) urlFor(m.file_path).then(u => window.open(u, '_blank', 'noopener')).catch(() => {}); };
    urlFor(m.file_path).then(u => { n.src = u; }).catch(() => { if (isImg) n.alt = 'Could not load'; });
    return n;
  }

  /* ---------- polls ---------- */
  function drawPoll(box) {
    const p = pollCache[box.dataset.poll]; box.replaceChildren();
    if (!p) { box.appendChild(el('div', 'ph', 'Loading poll…')); return; }
    const voters = new Set(); p.poll_options.forEach(o => o.poll_votes.forEach(v => voters.add(v.user_id)));
    box.append(el('div', 'q', '📊 ' + p.question), el('div', 'ph', (p.multi ? 'Select one or more' : 'Select one') + ' · ' + voters.size + (voters.size === 1 ? ' voter' : ' voters')));
    p.poll_options.forEach(o => {
      const n = o.poll_votes.length, mine = o.poll_votes.some(v => v.user_id === me.id);
      const b = el('button', 'popt' + (mine ? ' mine' : '')), f = el('i', 'fill'); b.type = 'button';
      f.style.width = (voters.size ? Math.round(n / voters.size * 100) : 0) + '%';
      b.append(f, el('span', '', (mine ? '✓ ' : '') + o.label), el('span', '', String(n)));
      b.onclick = e => { e.stopPropagation(); vote(o.id, p.id); };
      box.appendChild(b);
    });
  }
  async function loadPolls(ids) {
    if (!ids.length) return;
    const { data, error } = await nookDb.from('polls').select('id,question,multi,poll_options(id,label,position,poll_votes(user_id))').in('id', ids);
    if (error) return;
    data.forEach(p => { p.poll_options.sort((a, b) => a.position - b.position); pollCache[p.id] = p; });
    document.querySelectorAll('.poll').forEach(drawPoll);
  }
  const refreshPolls = () => loadPolls([...new Set([...document.querySelectorAll('.poll')].map(b => b.dataset.poll))]);
  async function vote(oid, pid) {
    const { error } = await nookDb.rpc('vote_poll', { p_option: oid });
    if (error) return toast(error.message);
    loadPolls([pid]);
  }
  function pollEl(m) {
    const b = el('div', 'poll'); b.dataset.poll = m.poll_id;
    drawPoll(b); if (!pollCache[m.poll_id]) loadPolls([m.poll_id]);
    return b;
  }

  /* wrap addBubble: draw photos / videos / files / polls inside the normal bubble */
  const _add = window.addBubble;
  window.addBubble = function (c, m) {
    const k = m.kind;
    if (k !== 'image' && k !== 'video' && k !== 'file' && k !== 'poll') return _add(c, m);
    const ob = m.body; m.body = ''; m.kind = 'text';
    try { _add(c, m); } finally { m.body = ob; m.kind = k; }
    const e = $('msgs').querySelector('[data-id="' + m.id + '"]'); if (!e) return;
    e.classList.add('x-' + k);
    e.insertBefore(k === 'poll' ? pollEl(m) : mediaEl(m), e.querySelector('small'));
  };

  /* ---------- sending files and polls ---------- */
  async function sendFile(file, c) {
    if (file.size > MAX) return toast(file.name + ' is over 25 MB');
    const kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
    const path = c.id + '/' + crypto.randomUUID() + '-' + file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
    toast('Uploading ' + file.name + '…');
    const up = await nookDb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream' });
    if (up.error) return toast('Upload failed: ' + up.error.message);
    const row = { conversation_id: c.id, sender_id: me.id, kind, file_path: path, file_name: file.name, file_type: file.type, file_size: file.size,
                  body: kind === 'image' ? '📷 Photo' : kind === 'video' ? '🎥 Video' : '📄 ' + file.name };
    if (replyTo && active === c) row.reply_to = replyTo.id;
    const { data, error } = await nookDb.from('messages').insert(row).select().single();
    if (error) return toast('Not sent: ' + error.message);
    if (active === c) clearReply();
    handleMessage(data);
  }
  async function sendFiles(files) {
    const c = active; if (!c || !canPost(c)) return;
    for (const f of files) await sendFile(f, c);
  }

  const attBtn = el('button', 'tool', '＋'); attBtn.type = 'button'; attBtn.id = 'attachBtn'; attBtn.setAttribute('aria-label', 'Attach');
  $('pickBtn').after(attBtn);
  const mediaIn = el('input'), docIn = el('input');
  mediaIn.type = docIn.type = 'file'; mediaIn.multiple = docIn.multiple = true; mediaIn.accept = 'image/*,video/*'; mediaIn.hidden = docIn.hidden = true;
  document.body.append(mediaIn, docIn);
  [mediaIn, docIn].forEach(i => i.onchange = () => { sendFiles([...i.files]); i.value = ''; });
  const attm = el('div', 'attm');
  [['🖼️ Photo or video', () => mediaIn.click()], ['📄 Document', () => docIn.click()], ['📊 Poll', () => openPoll()]].forEach(([t, fn]) => {
    const b = el('button', '', t); b.type = 'button'; b.onclick = () => { attm.classList.remove('open'); fn(); }; attm.appendChild(b);
  });
  document.body.appendChild(attm);
  attBtn.onclick = e => {
    e.stopPropagation(); const r = attBtn.getBoundingClientRect();
    attm.style.left = Math.max(8, Math.min(innerWidth - 200, r.left)) + 'px'; attm.style.bottom = (innerHeight - r.top + 8) + 'px';
    attm.classList.toggle('open');
  };
  document.addEventListener('click', () => attm.classList.remove('open'));

  /* poll dialog */
  const pov = el('div', 'overlay'); pov.id = 'pollOv';
  pov.innerHTML = '<div class="dialog"><h3>New poll</h3><input id="pQ" maxlength="200" placeholder="Ask a question" autocomplete="off"><div class="popts" id="pOpts"></div><button type="button" class="pchip" id="pAdd" style="margin-top:10px">+ Add option</button><label class="chk"><input type="checkbox" id="pMulti"> Allow multiple answers</label><div class="actions" style="margin-top:14px"><button class="close" id="pCancel" type="button" style="float:none">Cancel</button><button class="primary" id="pGo" type="button">Send poll</button></div></div>';
  document.body.appendChild(pov);
  const addOpt = () => { const i = el('input'); i.maxLength = 100; i.placeholder = 'Option ' + (document.querySelectorAll('#pOpts input').length + 1); $('pOpts').appendChild(i); };
  function openPoll() {
    if (!active || !canPost(active)) return;
    $('pQ').value = ''; $('pMulti').checked = false; $('pOpts').innerHTML = ''; addOpt(); addOpt();
    pov.classList.add('open'); $('pQ').focus();
  }
  $('pAdd').onclick = () => { if (document.querySelectorAll('#pOpts input').length < 6) addOpt(); else toast('Maximum 6 options'); };
  $('pCancel').onclick = () => pov.classList.remove('open');
  pov.addEventListener('click', e => { if (e.target === pov) pov.classList.remove('open'); });
  $('pGo').onclick = async () => {
    const q = $('pQ').value.trim(), opts = [...document.querySelectorAll('#pOpts input')].map(i => i.value.trim()).filter(Boolean), c = active;
    if (!q) return toast('Write a question'); if (opts.length < 2) return toast('Add at least 2 options');
    $('pGo').disabled = true;
    const { data, error } = await nookDb.rpc('create_poll', { p_cid: c.id, p_question: q, p_options: opts, p_multi: $('pMulti').checked });
    $('pGo').disabled = false;
    if (error) return toast(error.message);
    pov.classList.remove('open'); handleMessage(data);
  };

  /* ---------- more stickers ---------- */
  '🥰 😘 🤗 🤔 🫡 😬 🥲 🤝 👋 🫶 🤞 🧠 👀 🎂 🎁 🏆 🥇 ⚽ 🏏 🎮 🎧 🎬 📚 💻 🚀 🌈 ☀️ 🌙 ⭐ 🌸 🐝 🦋 🐙 🐬 🧋 🥂'.split(' ').forEach(em => {
    const b = el('button', 'stk', em); b.type = 'button'; b.setAttribute('aria-label', 'Send sticker ' + em);
    b.onclick = async () => { if (await sendMessage('sticker', em)) $('picker').classList.remove('open'); };
    $('pStickers').appendChild(b);
  });

  /* ---------- pin chat + info + nicknames ---------- */
  const pinBtn = el('button', 'hbtn', 'Pin'); pinBtn.type = 'button'; pinBtn.id = 'pinBtn'; $('head').appendChild(pinBtn);
  async function togglePin() {
    const c = active; if (!c) return; const v = !c.pinned;
    const { error } = await nookDb.rpc('set_chat_pin', { p_cid: c.id, p_pinned: v });
    if (error) return toast(error.message);
    c.pinned = v; renderList(); updateHeader(); toast(v ? 'Chat pinned' : 'Chat unpinned');
  }
  $('head').addEventListener('click', e => {
    if (e.target.closest('.back')) return;
    if (e.target.closest('#pinBtn')) { e.stopImmediatePropagation(); togglePin(); return; }
    if (active && active.type === 'direct') { e.stopImmediatePropagation(); openInfo(active); }
  }, true);

  const _upd = window.updateHeader;
  window.updateHeader = function () { _upd(); pinBtn.textContent = active && active.pinned ? 'Unpin' : 'Pin'; };

  const _rl = window.renderList;
  window.renderList = function () {
    chats.sort((a, b) => (!!b.pinned) - (!!a.pinned));           // stable: keeps newest-first inside each group
    _rl();
    const q = $('q').value.trim().toLowerCase();
    const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
    document.querySelectorAll('#list .item').forEach((it, i) => {
      const t = it.querySelector('time'); if (rows[i] && rows[i].pinned && t) t.textContent = '📌 ' + t.textContent;
    });
  };

  function applyNicks() {
    chats.forEach(c => {
      Object.entries(c.members).forEach(([id, u]) => { if (u.real == null) u.real = u.name; u.name = nicks[id] || u.real; });
      if (c.type === 'direct' && c.other && c.members[c.other]) c.name = c.members[c.other].name;
    });
  }
  async function setNick(id) {
    let real = 'this person'; chats.forEach(c => { if (c.members[id]) real = c.members[id].real || c.members[id].name; });
    const v = prompt('Nickname for ' + real + ' (only you can see it). Leave empty to remove.', nicks[id] || '');
    if (v === null) return;
    const n = v.trim().slice(0, 40);
    const r = n ? await nookDb.from('nicknames').upsert({ owner_id: me.id, target_id: id, nickname: n })
                : await nookDb.from('nicknames').delete().eq('owner_id', me.id).eq('target_id', id);
    if (r.error) return toast('Could not save nickname: ' + r.error.message);
    if (n) nicks[id] = n; else delete nicks[id];
    applyNicks(); renderList(); updateHeader();
    if (active) { const c = active; openChat(c); openInfo(c); }
  }
  function decorate(c) {
    const ids = c.type === 'direct' ? [c.other] : Object.entries(c.members).sort((a, b) => (b[0] === c.owner) - (a[0] === c.owner)).map(x => x[0]);
    document.querySelectorAll('#iMembers .member').forEach((row, i) => {
      const id = ids[i]; if (!id || id === me.id) return;
      const b = el('button', 'pchip', nicks[id] ? 'Edit nickname' : 'Set nickname'); b.type = 'button'; b.style.marginLeft = '8px'; b.onclick = () => setNick(id); row.appendChild(b);
    });
  }
  const _info = window.openInfo;
  window.openInfo = function (c) {
    $('iLeave').style.display = '';
    if (c.type === 'direct') {
      const u = c.members[c.other] || { name: c.name, username: '' };
      $('iTitle').textContent = c.name; $('iHint').textContent = 'Direct chat' + (u.real && u.real !== u.name ? ' · real name: ' + u.real : '');
      const box = $('iMembers'); box.innerHTML = '';
      const r = el('div', 'member'); r.innerHTML = '<div class="avatar"></div><div><b></b><small></small></div>';
      const av = r.querySelector('.avatar'); av.textContent = initial(u.name); if (online.has(c.other)) av.classList.add('on');
      r.querySelector('b').textContent = u.name; r.querySelector('small').textContent = (u.username ? '@' + u.username : '') + (online.has(c.other) ? ' · online' : '');
      box.appendChild(r); $('iLeave').style.display = 'none'; $('iOverlay').classList.add('open');
    } else _info(c);
    decorate(c);
  };

  /* ---------- data: pins + nicknames, live poll votes ---------- */
  const _lc = window.loadChats;
  window.loadChats = async function () {
    await _lc();
    const [pn, nk] = await Promise.all([
      nookDb.from('conversation_members').select('conversation_id,pinned').eq('user_id', me.id),
      nookDb.from('nicknames').select('target_id,nickname').eq('owner_id', me.id)
    ]);
    if (!pn.error) pn.data.forEach(r => { if (byId[r.conversation_id]) byId[r.conversation_id].pinned = !!r.pinned; });
    if (!nk.error) { nicks = {}; nk.data.forEach(r => { nicks[r.target_id] = r.nickname; }); }
    applyNicks(); renderList(); updateHeader();
    if (!liveOn) {
      liveOn = true; let t;
      nookDb.channel('nook-polls').on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, () => { clearTimeout(t); t = setTimeout(refreshPolls, 300); }).subscribe();
    }
  };

  /* ---------- new message notifications ---------- */
  const nb = el('button', ''); nb.setAttribute('role', 'menuitem'); $('newMenu').appendChild(nb);
  const nbLabel = () => { nb.textContent = 'Notifications: ' + (window.Notification && Notification.permission === 'denied' ? 'blocked' : notifyOn ? 'on' : 'off'); };
  nbLabel();
  nb.onclick = async () => {
    notifyOn = !notifyOn; store.set('nook-notify', notifyOn ? 'on' : 'off');
    if (notifyOn && window.Notification && Notification.permission === 'default') await Notification.requestPermission();
    if (notifyOn && window.Notification && Notification.permission === 'denied') toast('Notifications are blocked in your browser settings');
    nbLabel();
  };
  document.addEventListener('pointerdown', () => {
    if (notifyOn && window.Notification && Notification.permission === 'default') Notification.requestPermission().then(nbLabel);
  }, { once: true });

  function notify(m) {
    if (!me || m.sender_id === me.id || notified.has(m.id)) return; notified.add(m.id);
    const c = byId[m.conversation_id]; if (!c || !notifyOn) return;
    const open = !document.hidden && active && active.id === c.id; if (open) return;
    const text = (c.type === 'direct' ? '' : nameOf(c, m.sender_id) + ': ') + snippet(m);
    if (document.hidden && window.Notification && Notification.permission === 'granted') {
      try { const n = new Notification(c.name, { body: text, tag: c.id }); n.onclick = () => { window.focus(); openChat(c); n.close(); }; return; } catch (e) {}
    }
    toast(c.name + ' · ' + text);
  }
  const _hm = window.handleMessage;
  window.handleMessage = async function (m) { await _hm(m); try { notify(m); } catch (e) {} };
})();

</script>

<!-- ===== Added feature: profile pictures ===== -->
<script>
(function () {
  'use strict';
  const AV_BUCKET = 'avatars', AV_SIZE = 256, AV_MAX_IN = 15 * 1024 * 1024;
  const avatars = {};                       // userId -> public photo url
  const avEl = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  const css = document.createElement('style');
  css.textContent = `
#meAvatar{cursor:pointer}
#meAvatar:hover{outline:2px solid var(--marigold);outline-offset:2px}
.avatar{background-size:cover;background-position:center}
.pf{text-align:center}
.pf .big{width:112px;height:112px;margin:6px auto 14px;font-size:44px;font-family:var(--head);font-weight:800}
.pf .pfn{font-weight:700;font-size:18px}.pf small{display:block;color:var(--muted);margin-bottom:12px}
.pf .actions{justify-content:center;flex-wrap:wrap}`;
  document.head.appendChild(css);

  /* show a photo (or the initial) inside any .avatar element */
  function setAv(node, id, fallback) {
    if (!node) return;
    const url = avatars[id];
    if (url) {
      node.style.backgroundImage = 'url("' + String(url).replace(/"/g, '%22') + '")';
      node.textContent = '';
    } else {
      node.style.backgroundImage = '';
      if (fallback != null) node.textContent = fallback;
    }
  }
  function repaint() {
    if (!me) return;
    setAv($('meAvatar'), me.id, initial(me.name));
    renderList(); updateHeader();
    const big = $('pfBig'); if (big) setAv(big, me.id, initial(me.name));
  }

  /* load everyone's photos (keeps initials if the avatar_url column does not exist yet) */
  async function loadAvatars() {
    try {
      const ids = new Set([me.id]);
      chats.forEach(c => Object.keys(c.members).forEach(id => ids.add(id)));
      const { data, error } = await nookDb.from('profiles').select('id,avatar_url').in('id', [...ids]);
      if (error || !data) return;
      data.forEach(r => { if (r.avatar_url) avatars[r.id] = r.avatar_url; else delete avatars[r.id]; });
    } catch (e) {}
  }
  let wired = false;
  const _lc = window.loadChats;
  window.loadChats = async function () {
    await _lc();
    await loadAvatars(); repaint();
    if (wired) return; wired = true;
    try {
      nookDb.channel('nook-profiles').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, p => {
        const r = p.new; if (!r || !me || r.id === me.id) return;
        if (r.avatar_url) avatars[r.id] = r.avatar_url; else delete avatars[r.id];
        repaint();
      }).subscribe();
    } catch (e) {}
  };

  /* draw photos in the sidebar, chat header and info dialog */
  const _rl = window.renderList;
  window.renderList = function () {
    _rl();
    const q = $('q').value.trim().toLowerCase();
    const rows = chats.filter(c => (filter === 'all' || c.type === filter) && c.name.toLowerCase().includes(q));
    document.querySelectorAll('#list .item').forEach((it, i) => {
      const c = rows[i]; if (c && c.type === 'direct') setAv(it.querySelector('.avatar'), c.other, initial(c.name));
    });
  };
  const _uh = window.updateHeader;
  window.updateHeader = function () {
    _uh();
    if (active && active.type === 'direct') setAv($('hAvatar'), active.other, initial(active.name));
  };
  const _oi = window.openInfo;
  window.openInfo = function (c) {
    _oi(c);
    const ids = c.type === 'direct' ? [c.other]
      : Object.entries(c.members).sort((a, b) => (b[0] === c.owner) - (a[0] === c.owner)).map(x => x[0]);
    document.querySelectorAll('#iMembers .member').forEach((row, i) => {
      const id = ids[i]; if (id) setAv(row.querySelector('.avatar'), id, null);
    });
  };

  /* profile photo dialog */
  const ov = avEl('div', 'overlay'); ov.id = 'pfOv';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Profile photo');
  ov.innerHTML = '<div class="dialog pf"><h3>Profile photo</h3><div class="avatar big" id="pfBig"></div><div class="pfn" id="pfName"></div><small id="pfUser"></small>' +
    '<div class="actions"><button class="primary" id="pfChange" type="button">Choose photo</button><button class="danger" id="pfRemove" type="button">Remove</button><button class="close" id="pfClose" type="button" style="float:none">Close</button></div></div>';
  document.body.appendChild(ov);
  const fileIn = avEl('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.hidden = true; document.body.appendChild(fileIn);

  function openProfile() {
    if (!me) return;
    $('pfName').textContent = me.name; $('pfUser').textContent = me.username ? '@' + me.username : '';
    setAv($('pfBig'), me.id, initial(me.name));
    $('pfRemove').style.display = avatars[me.id] ? '' : 'none';
    ov.classList.add('open');
  }
  const closeProfile = () => ov.classList.remove('open');
  $('pfClose').onclick = closeProfile;
  ov.addEventListener('click', e => { if (e.target === ov) closeProfile(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProfile(); });

  $('meAvatar').setAttribute('role', 'button'); $('meAvatar').tabIndex = 0; $('meAvatar').setAttribute('aria-label', 'Change profile photo');
  $('meAvatar').onclick = openProfile;
  $('meAvatar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProfile(); } });
  const mi = avEl('button', '', 'Profile photo'); mi.setAttribute('role', 'menuitem'); mi.onclick = openProfile; $('newMenu').appendChild(mi);

  $('pfChange').onclick = () => fileIn.click();
  fileIn.onchange = () => { const f = fileIn.files[0]; fileIn.value = ''; if (f) saveAvatar(f); };

  /* crop to a centred square and shrink, so uploads stay tiny */
  function toSquare(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas');
        cv.width = cv.height = AV_SIZE;
        cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, AV_SIZE, AV_SIZE);
        URL.revokeObjectURL(url);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not process image')), 'image/jpeg', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a supported image')); };
      img.src = url;
    });
  }
  async function clearOld(keep) {
    try {
      const { data } = await nookDb.storage.from(AV_BUCKET).list(me.id);
      const old = (data || []).map(f => me.id + '/' + f.name).filter(p => p !== keep);
      if (old.length) await nookDb.storage.from(AV_BUCKET).remove(old);
    } catch (e) {}
  }
  async function saveAvatar(file) {
    if (!file.type.startsWith('image/')) return toast('Please choose an image');
    if (file.size > AV_MAX_IN) return toast('Image is over 15 MB');
    $('pfChange').disabled = true; toast('Uploading photo…');
    try {
      const blob = await toSquare(file), path = me.id + '/' + Date.now() + '.jpg';
      const up = await nookDb.storage.from(AV_BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (up.error) throw up.error;
      const url = nookDb.storage.from(AV_BUCKET).getPublicUrl(path).data.publicUrl;
      const { error } = await nookDb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
      if (error) throw error;
      avatars[me.id] = url; clearOld(path); repaint();
      $('pfRemove').style.display = ''; toast('Profile photo updated');
    } catch (err) { toast('Could not save photo: ' + (err.message || err)); }
    $('pfChange').disabled = false;
  }
  $('pfRemove').onclick = async () => {
    const { error } = await nookDb.from('profiles').update({ avatar_url: null }).eq('id', me.id);
    if (error) return toast('Could not remove photo: ' + error.message);
    delete avatars[me.id]; clearOld(null); repaint(); $('pfRemove').style.display = 'none'; toast('Photo removed');
  };
})();
</script>

  function toSquare(file) {

        cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not process image')), 'image/jpeg', 0.88);

  async function clearOldGroupPhotos(cid, keep) {

<!-- ===== Added feature: voice and video calls (WebRTC, signalling over Supabase Realtime) ===== -->
<script>
(function () {
  'use strict';
  /* Free STUN servers work on most home and mobile networks. For calls that must work on EVERY network
     (strict offices, some mobile carriers) add a TURN server here, for example:
     { urls: 'turn:your.server.com:3478', username: 'user', credential: 'pass' } */
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  const RING_MS = 45000;
  const ce = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const fmtDur = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  let call = null, incoming = null, ringTimer = null, actx = null, ready = false;
  const chans = {};

  const css = document.createElement('style');
  css.textContent = `
.callbtn{margin-left:6px;font-size:16px;padding:8px 12px}

.cBar{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:3}

#inOv{position:fixed;inset:0;z-index:75;background:rgba(11,16,33,.94);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}

#inOv .cBtn.ok{background:#2fd17b}
#inOv small{display:block;opacity:.8;margin-top:4px}`;
  document.head.appendChild(css);

  /* ---------- screens ---------- */
  document.body.insertAdjacentHTML('beforeend',
    '<div id="callOv" role="dialog" aria-modal="true" aria-label="Call">' +
      '<video id="cRemote" autoplay playsinline></video>' +
      '<div class="avatar cAv" id="cAv"></div>' +
      '<div class="cTop"><b id="cName"></b><span id="cStatus"></span></div>' +
      '<video id="cLocal" autoplay playsinline muted></video>' +
      '<div class="cBar"><button class="cBtn" id="cMute" type="button" aria-label="Mute microphone">&#127908;</button>' +
      '<button class="cBtn" id="cCam" type="button" aria-label="Turn camera off">&#128247;</button>' +
      '<button class="cBtn end" id="cEnd" type="button" aria-label="End call">&#128222;</button></div>' +
    '</div>' +
    '<div id="inOv" role="alertdialog" aria-modal="true" aria-label="Incoming call">' +
      '<div class="avatar" id="inAv"></div><b id="inName"></b><span id="inKind"></span>' +
      '<div class="btns"><button class="cBtn end" id="inNo" type="button" aria-label="Decline">&#128222;</button>' +
      '<button class="cBtn ok" id="inYes" type="button" aria-label="Accept">&#128222;</button></div>' +
    '</div>');

  /* call buttons in the chat header (direct chats only) */
  const vb = ce('button', 'hbtn callbtn', '📞'), cb = ce('button', 'hbtn callbtn', '🎥');
  vb.type = cb.type = 'button'; vb.dataset.video = '0'; cb.dataset.video = '1';
  vb.setAttribute('aria-label', 'Voice call'); cb.setAttribute('aria-label', 'Video call');
  vb.title = 'Voice call'; cb.title = 'Video call';
  vb.style.display = cb.style.display = 'none';
  $('pinBtn').after(vb, cb);
  /* the header has its own click handlers (open info), so catch call-button clicks first */
  window.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.callbtn'); if (!b) return;

  }, true);
  const _uh = window.updateHeader;
  window.updateHeader = function () {
    _uh();
    const show = !!(active && active.type === 'direct' && active.other);
    vb.style.display = cb.style.display = show ? '' : 'none';
  };

  /* ---------- signalling ---------- */
  function chanFor(uid) {
    if (chans[uid]) return chans[uid];
    const ch = nookDb.channel('nook-call-' + uid, { config: { broadcast: { self: false } } });
    chans[uid] = { ch, ready: new Promise(res => ch.subscribe(s => { if (s === 'SUBSCRIBED') res(); })) };
    return chans[uid];
  }
  async function send(uid, payload) {
    try {
      const c = chanFor(uid); await c.ready;
      await c.ch.send({ type: 'broadcast', event: 'call', payload: Object.assign({}, payload, { from: me.id, to: uid }) });
    } catch (e) {}
  }
  function setup() {
    nookDb.channel('nook-call-' + me.id)
      .on('broadcast', { event: 'call' }, ({ payload }) => { onSignal(payload).catch(() => {}); })
      .subscribe();
  }
  const _lc = window.loadChats;
  window.loadChats = async function () { await _lc(); if (!ready && me) { ready = true; setup(); } };

  function resolveWhen(t, at) {
    const base = new Date(at); base.setHours(0, 0, 0, 0);
    const back = new Date(base.getTime() - 30 * DAY);
    let day = null, mon = null, m = t.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s*(?:of\\s*)?(' + MONTHS + ')\\b'));
    if (m) { day = +m[1]; mon = MIDX[m[2].slice(0, 3)]; }
    else if ((m = t.match(new RegExp('\\b(' + MONTHS + ')\\s*(\\d{1,2})(?:st|nd|rd|th)?\\b')))) { mon = MIDX[m[1].slice(0, 3)]; day = +m[2]; }
    if (mon != null && day >= 1 && day <= 31) {
      const d = new Date(base.getFullYear(), mon, day); if (d < back) d.setFullYear(d.getFullYear() + 1); return d;
    }
    m = t.match(/\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/);
    if (m) {
      const dd = +m[1], mm = +m[2];
      if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) {
        let y = m[3] ? +m[3] : base.getFullYear(); if (y < 100) y += 2000;
        const d = new Date(y, mm - 1, dd); if (!m[3] && d < back) d.setFullYear(y + 1); return d;
      }
    }
    if (/\b(?:parso|parson|day after tomorrow)\b/.test(t)) return addDays(base, 2);
    if (/\b(?:kal|kl|tomorrow|tomorow|tmrw|tmr)\b/.test(t)) return addDays(base, 1);
    if (/\b(?:aaj|today|tonight)\b/.test(t)) return base;
    m = t.match(new RegExp('\\b(' + DAYS + ')\\b'));
    if (m) { let diff = (DIDX[m[1].slice(0, 3)] - base.getDay() + 7) % 7; if (diff === 0) diff = 7; return addDays(base, diff); }
    return null;
  }

  function analyze(raw, c) {
    const msgs = raw.filter(m => (!m.kind || m.kind === 'text') && m.body && !/^(?:📞|✨ Catch me up)/.test(m.body));
    const r = { total: raw.length, texts: msgs.length, first: raw[0], last: raw[raw.length - 1], hing: 0,
      media: { image: 0, video: 0, file: 0, poll: 0 }, deadlines: [], decisions: [], open: [], you: [], links: [], topics: [],
      nDl: 0, nDec: 0, nQ: 0, moreDl: 0, moreDec: 0, moreQ: 0 };
    const people = new Set();
    raw.forEach(m => { people.add(m.sender_id); if (r.media[m.kind] != null) r.media[m.kind]++; });
    r.people = people.size;

    const myU = (me.username || '').toLowerCase(), myF = (me.name || '').split(' ')[0].toLowerCase();
    const nameToks = new Set(['nook']);
    Object.values(c.members).forEach(u => tokens(String(u.name || '').toLowerCase()).forEach(w => nameToks.add(w)));
    const mine = new Set(raw.filter(m => m.sender_id === me.id).map(m => m.id));
    const kw = s => tokens(s.toLowerCase()).filter(w => w.length >= 4 && !STOP.has(w) && !nameToks.has(w) && !/^\d+$/.test(w));
    const qFlag = msgs.map(m => isQ(m.body));
    const freq = {}, seen = new Set(), dls = [], decs = [], links = new Set();
    const t0 = startToday();

    msgs.forEach((m, i) => {
      const low = m.body.toLowerCase(), toks = tokens(low), key = low.replace(/\s+/g, ' ').trim();
      if (toks.some(w => HING.has(w))) r.hing++;
      new Set(kw(low)).forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      (m.body.match(/https?:\/\/[^\s<]+/g) || []).forEach(u => {
        u = u.replace(/[.,!?)]+$/, ''); if (!links.has(u)) { links.add(u); r.links.push({ m, u }); }
      });
      if (m.sender_id !== me.id &&
          ((myU && low.includes('@' + myU)) || (myF.length >= 3 && toks.includes(myF)) || (m.reply_to && mine.has(m.reply_to)))) r.you.push(m);
      if (seen.has(key)) return; seen.add(key);

      const hasWhen = RE_DATE.test(low) || RE_TIME.test(low) || RE_REL.test(low);
      const isDl = !qFlag[i] && ((RE_STRONG.test(low) && (hasWhen || RE_TASK.test(low))) || (hasWhen && RE_TASK.test(low) && /\b(?:tak|by|before|pehle|submit|due|hai|hoga|hogi|will|is)\b/.test(low)));
      if (isDl) {
        const tm = low.match(RE_TIME);
        dls.push({ m, when: resolveWhen(low, m.created_at), time: tm ? tm[0].replace(/\s+/g, '').toUpperCase().replace(/(BAJE|BJE)$/, ' baje') : '' });
      } else if (!qFlag[i] && m.body.length >= 12 && RE_DEC.test(low)) decs.push(m);
    });

    /* open questions: nobody replied and nobody seems to have answered */
    const open = [];
    msgs.forEach((q, i) => {
      if (!qFlag[i]) return;
      const qk = new Set(kw(q.body));
      let ans = msgs.some(n => n.reply_to === q.id && n.sender_id !== q.sender_id);
      for (let j = i + 1; !ans && j < msgs.length && j <= i + 6; j++) {
        const n = msgs[j]; if (n.sender_id === q.sender_id || qFlag[j]) continue;
        const nl = n.body.toLowerCase();
        if (kw(nl).some(w => qk.has(w)) || (j <= i + 2 && (/\d/.test(nl) || RE_ANS.test(nl)))) ans = true;
      }
      if (!ans) open.push(q);
    });

    const up = dls.filter(d => d.when && d.when >= t0).sort((a, b) => a.when - b.when);
    const und = dls.filter(d => !d.when);
    const past = dls.filter(d => d.when && d.when < t0);
    const allDl = [...up, ...und, ...past.slice(-3)];
    r.nDl = allDl.length; r.deadlines = allDl.slice(0, 8); r.moreDl = Math.max(0, allDl.length - 8);
    r.nDec = decs.length; r.decisions = decs.slice(-8); r.moreDec = Math.max(0, decs.length - 8);
    r.nQ = open.length; r.open = open.slice(-8); r.moreQ = Math.max(0, open.length - 8);
    r.you = r.you.slice(-6); r.links = r.links.slice(-6);
    r.topics = Object.entries(freq).filter(e => e[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);
    if (!r.topics.length) r.topics = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 4).map(e => e[0]);
    return r;
  }

  /* ------------------------------------------------------------------ the panel */
  const ov = ce('div', 'overlay'); ov.id = 'cuOv';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Catch me up');
  ov.innerHTML = '<div class="dialog"><h3>✨ Catch me up</h3><p class="hint" id="cuSub" style="padding:2px 0 0"></p>' +
    '<div class="cuCtl"><div class="cuSeg" id="cuRange"></div><div class="cuSeg" id="cuLang"></div></div>' +
    '<div id="cuBody"></div><div class="cuPriv" id="cuPriv"></div>' +
    '<div class="actions" style="margin-top:14px;align-items:center"><button class="close" id="cuClose" type="button" style="float:none"></button>' +
    '<span style="display:flex;gap:8px"><button class="pchip" id="cuCopy" type="button"></button><button class="primary" id="cuShare" type="button"></button></span></div></div>';
  document.body.appendChild(ov);

  let cu = null, seq = 0;
  const L = () => LBL[(cu && cu.lang) || 'en'];
  const closePanel = () => { ov.classList.remove('open'); cu = null; seq++; };
  $('cuClose').onclick = closePanel;

  function drawCtl() {
    const l = L(), r = $('cuRange'), g = $('cuLang');
    r.replaceChildren(); g.replaceChildren();
    [['missed', l.since], [50, l.last(50)], [200, l.last(200)], [500, l.last(500)]].forEach(([v, t]) => {
      const b = ce('button', '', t); b.type = 'button'; b.setAttribute('aria-pressed', String(cu.range === v));
      if (v === 'missed' && !cu.c.catchFrom) b.disabled = true;
      b.onclick = () => { if (cu.range === v) return; cu.range = v; load(); };
      r.appendChild(b);
    });
    [['en', 'English'], ['hi', 'Hinglish']].forEach(([v, t]) => {
      const b = ce('button', '', t); b.type = 'button'; b.setAttribute('aria-pressed', String(cu.lang === v));
      b.onclick = () => { cu.lang = v; store.set('nook-cu-lang', v); if (cu.res) render(); else drawCtl(); };
      g.appendChild(b);

  }
  function paintPriv() {
    const l = L(); $('cuPriv').textContent = l.priv + (cu && cu.use != null ? ' ' + l.use(cu.use) : '');
  }
  function chipFor(d, l) {
    if (!d.when) return d.time ? { t: d.time } : null;
    const diff = Math.round((d.when - startToday()) / DAY), parts = [];
    const rel = diff < 0 ? l.passed : diff === 0 ? l.today : diff === 1 ? l.tom : '';
    if (rel) parts.push(rel); parts.push(fmtDay(d.when)); if (d.time) parts.push(d.time);
    return { t: parts.join(' · '), past: diff < 0 };
  }
  function spanText(r, l) {
    const a = new Date(r.first.created_at), b = new Date(r.last.created_at);
    if (a.toDateString() === b.toDateString()) return a.toDateString() === new Date().toDateString() ? l.todayWord : fmtShort(a);
    return l.span(fmtShort(a), fmtShort(b));
  }
  function jumpFromPanel(m) {
    closePanel();
    if ($('msgs').querySelector('[data-id="' + m.id + '"]')) setTimeout(() => jumpTo(m.id), 60);
    else toast('That message is older than what is loaded in this chat');
  }
  function itemBtn(c, m, chip) {
    const b = ce('button', 'cuit'), h = ce('div'); b.type = 'button';
    h.append(ce('b', '', nameOf(c, m.sender_id)), ce('small', '', fmt(m.created_at)));
    if (chip) h.append(ce('span', 'cuwhen' + (chip.past ? ' past' : ''), chip.t));
    b.append(h, ce('div', 'tx', clip(m.body, 170)));
